<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1230">
<title>Crown Rally — Kraliyet Turu</title>
<!-- yazı tipi: @import yerine bağlantı (CSS'i bekletmeden paralel iner) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
<style>
:root{--gasW:clamp(100px,25vmin,196px);--nitroW:clamp(62px,14.5vmin,116px);--purple:#8b46ff;--purple2:#5b22d6;--gold:#ffc21a;--gold2:#d98e00;--panel:rgba(20,15,38,.74);--rowh:clamp(26px,5.6vmin,46px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1230;font-family:'Russo One',system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
#game,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#hud{position:fixed;inset:0;pointer-events:none}
.it{font-style:italic;transform:skewX(-6deg)}
/* sıralama */
#board{position:absolute;left:calc(1.6vmin + env(safe-area-inset-left));top:calc(1.6vmin + env(safe-area-inset-top));width:clamp(150px,31vmin,270px);height:calc(var(--rowh)*5)}
.row{position:absolute;left:0;top:0;right:0;height:calc(var(--rowh) - 4px);display:flex;align-items:center;gap:.45em;font-size:calc(var(--rowh)*.42);
  background:linear-gradient(90deg,rgba(22,17,42,.88),rgba(22,17,42,.62) 70%,rgba(22,17,42,0));border-radius:7px 0 0 7px;
  transition:transform .5s cubic-bezier(.3,1.5,.5,1);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.row .n{width:calc(var(--rowh)*.92);height:100%;display:grid;place-items:center;background:rgba(0,0,0,.32);border-radius:7px 0 0 7px;font-size:1.45em}
.row .cr{width:1.35em;height:1.05em;color:#ffd23f;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.row .fin{margin-left:auto;margin-right:1.2em;font-size:.8em;color:#9ff0b0}
.row.me{background:linear-gradient(90deg,var(--purple2),var(--purple) 55%,rgba(139,70,255,0))}
.row.me .cr{color:#fff}
.row.p2{background:linear-gradient(90deg,var(--gold2),var(--gold) 55%,rgba(255,194,26,0))}
.row.p2 .cr{color:#fff}
/* tur + süre + harita */
#lapwrap{position:absolute;right:calc(1.6vmin + env(safe-area-inset-right));top:calc(1.6vmin + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:.8vmin}
.lapbox{display:flex;align-items:center;font-size:clamp(16px,3.8vmin,32px);background:var(--panel);border-radius:10px;overflow:hidden}
.lapbox span{padding:.25em .55em .25em .7em}
.lapbox b{font-weight:400;color:var(--gold);font-size:1.45em;padding:0 .45em;background:rgba(0,0,0,.3);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.timer{display:flex;align-items:center;gap:.45em;font-size:clamp(13px,2.8vmin,22px);background:var(--panel);border-radius:9px;padding:.35em .7em}
.timer svg{width:1.15em;height:1.15em}
.laptime{font-size:clamp(10px,2vmin,15px);background:var(--panel);border-radius:8px;padding:.3em .7em;color:#d9ccff}
.laptime b{font-weight:400;color:#fff}
#minimap{width:clamp(110px,24vmin,200px);height:clamp(110px,24vmin,200px);margin-top:.6vmin}
/* araç etiketleri */
.tag{position:absolute;left:0;top:0;transform-origin:50% 100%;padding:.12em .45em;border-radius:5px;font-size:clamp(9px,1.55vmin,13px);white-space:nowrap;will-change:transform;opacity:.92}
.tag::after{content:"";position:absolute;left:50%;bottom:-.34em;margin-left:-.34em;border:.34em solid transparent;border-bottom:0;border-top-color:inherit}
.tag.p2{background:var(--gold);color:#3a2500;border-color:var(--gold)}
.tag.bot{background:rgba(25,20,40,.78);border-color:rgba(25,20,40,.78)}
/* giriş, geri sayım, bildirim, bölge */
#intro{position:absolute;left:50%;top:calc(3vmin + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1vmin;transition:opacity .5s,transform .5s}
#intro.hide{opacity:0;transform:translate(-50%,-30px)}
#intro .track{font-size:clamp(18px,4.6vmin,40px);background:linear-gradient(90deg,var(--purple2),var(--purple));padding:.2em .9em;border-radius:12px;box-shadow:0 4px 0 #3a1490;letter-spacing:.04em}
#intro .chip{font-size:clamp(11px,2.4vmin,18px);background:var(--panel);padding:.35em .9em;border-radius:99px;display:flex;gap:.5em;align-items:center}
#intro .chip i{font-style:normal;color:var(--gold)}
#region{position:absolute;left:50%;top:calc(3vmin + env(safe-area-inset-top));transform:translateX(-50%);opacity:0;display:flex;flex-direction:column;align-items:center;gap:.3em;white-space:nowrap}
#region b{font-weight:400;font-size:clamp(18px,4.2vmin,36px);letter-spacing:.06em;color:#fff;-webkit-text-stroke:.03em #3b1680;text-shadow:0 .08em 0 #3b1680}
#region.show{animation:region 3.2s ease forwards}
@keyframes region{0%{opacity:0;transform:translate(-50%,-18px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
#count{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(70px,22vmin,200px);color:#ffd23f;white-space:nowrap;
  -webkit-text-stroke:.035em #3b1680;text-shadow:0 .07em 0 #3b1680,0 0 .4em rgba(255,170,60,.45);opacity:0}
#count.pop{animation:pop .58s ease-out forwards}
#count.go{color:#fff;-webkit-text-stroke-color:#5b22d6;text-shadow:0 .07em 0 #5b22d6,0 0 .5em rgba(160,100,255,.7);animation:popgo .8s ease-out forwards}
#count.fin{font-size:clamp(50px,15vmin,140px);animation:fin 2.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
@keyframes popgo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-4deg)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(-4deg)}}
@keyframes fin{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-6deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-4deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(18px,5vmin,44px);opacity:0;white-space:nowrap;
  color:#fff;-webkit-text-stroke:.03em #3b1680;text-shadow:0 .08em 0 #3b1680}
#toast.gold{color:#ffd23f}
#toast.show{animation:toast 1.2s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}30%{transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}
/* ipucu: ✕ ÇIK düğmesinin üstünde, iki yandaki tuşların arasına sığacak genişlikte (gerekirse iki satır) */
#hint{position:absolute;left:50%;bottom:calc(1.6vmin + clamp(10px,1.8vmin,13px) * 2.4 + 6px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:clamp(10px,2vmin,15px);background:var(--panel);padding:.45em 1em;border-radius:1.2em;opacity:.95;transition:opacity .6s;width:max-content;max-width:max(200px,calc(100vw - 110vmin));text-align:center;line-height:1.35}
#hint.hide{opacity:0}
/* hız göstergesi nitro düğmesinin solunda, aynı hizada (mini haritaya ve tuşlara binmez) */
#speedo{position:absolute;right:calc(6vmin + var(--gasW) / 2 + var(--nitroW) / 2 + env(safe-area-inset-right));bottom:calc(6vmin + var(--gasW) * 1.12 + 2.2vmin + var(--nitroW) / 2 + env(safe-area-inset-bottom));transform:translateY(50%);font-size:clamp(13px,2.6vmin,20px);background:var(--panel);border-radius:9px;padding:.25em .6em;text-align:right;min-width:5.2em}
#speedo b{font-weight:400;font-size:1.5em}
#speedo small{opacity:.7;font-size:.7em;margin-left:.2em}
/* kontroller */
/* tuşlar başparmağın rahat eriştiği yükseklikte ve büyük (dokunma alanı görünen tuştan da geniştir) */
.pad{position:fixed;display:flex;gap:2.4vmin;align-items:center;pointer-events:none}
#padL{left:calc(3vmin + env(safe-area-inset-left));bottom:calc(7vmin + env(safe-area-inset-bottom));gap:1vmin}
/* yön tuşları: büyük ve birbirine yakın (aradaki boşlukta da hangi tarafa yakınsa o yön sayılır) */
#bl,#br{--sz:clamp(90px,24vmin,180px)}
#padR{right:calc(3.5vmin + env(safe-area-inset-right));bottom:calc(6vmin + env(safe-area-inset-bottom));flex-direction:column;align-items:center;gap:2.2vmin}
.btn{--sz:clamp(76px,19vmin,150px);width:var(--sz);height:var(--sz);border-radius:50%;pointer-events:auto;cursor:pointer;
  border:clamp(2px,.5vmin,4px) solid rgba(255,255,255,.55);background:rgba(35,26,45,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;color:rgba(255,255,255,.9);transition:transform .08s,background .15s;touch-action:none;outline:none;-webkit-touch-callout:none}
/* dokunmatikte tuşların arkası bulanıklaştırılmaz: hareketli oyun görüntüsü her karede yeniden bulanıklaştırılıyordu */
@media (pointer:coarse){.btn{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(35,26,45,.5)}}
.btn svg{width:46%;height:46%}
.btn.on{transform:scale(.9);background:rgba(255,255,255,.28)}
#gas{--sz:var(--gasW);height:calc(var(--sz) * 1.12);border-radius:26%;border-width:clamp(3px,.6vmin,5px);
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(35,26,45,.42));box-shadow:0 .6vmin 0 rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.08)}
#gas svg{width:54%;height:54%}
#gas.on{border-color:rgba(255,210,120,.9);box-shadow:0 .3vmin 0 rgba(0,0,0,.25),0 0 22px rgba(255,170,70,.45)}
#gas.auto{border-color:rgba(255,210,120,.75);box-shadow:0 .6vmin 0 rgba(0,0,0,.25),0 0 22px rgba(255,170,70,.35)}
#gas.auto svg,#gas.on svg{animation:gasPulse .45s ease-in-out infinite alternate}
@keyframes gasPulse{from{transform:translateY(4%);opacity:.75}to{transform:translateY(-4%);opacity:1}}
#padB{right:calc(8.5vmin + var(--gasW) + env(safe-area-inset-right));bottom:calc(6vmin + env(safe-area-inset-bottom))}
#rev{--sz:clamp(66px,15.5vmin,124px);display:flex;flex-direction:column;gap:0;font-size:clamp(8px,1.6vmin,12px);letter-spacing:.04em}
#rev svg{width:40%;height:40%}
#wrong{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(26px,7vmin,64px);color:#fff;background:linear-gradient(90deg,#c81e3a,#ff3b5c);padding:.15em .8em;border-radius:14px;box-shadow:0 5px 0 #7a0f22;white-space:nowrap;opacity:0;transition:opacity .2s}
#wrong.on{opacity:1;animation:wrongBlink .5s infinite alternate}
@keyframes wrongBlink{to{filter:brightness(1.35)}}
#nitro{--sz:var(--nitroW);position:relative;border-color:transparent;background:rgba(30,20,55,.55)}
#nitro .ring{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);transform:rotate(-90deg)}
#nitro .bolt{width:44%;height:44%;color:#5aa8ff;filter:drop-shadow(0 0 6px rgba(90,168,255,.7))}
/* nitro hazır parıltısı: gölgenin kendisi değil yalnızca saydamlığı canlandırılır (her karede yeniden boyama olmaz) */
#nitro::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 6px rgba(139,70,255,.35),0 0 30px rgba(139,70,255,.6);opacity:0;pointer-events:none}
#nitro.ready::after{animation:ready 1s infinite}
#nitro.ready .bolt{color:#fff}
@keyframes ready{50%{opacity:1}}
/* bitiş kartı */
#end{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(25,12,45,.35),rgba(20,8,38,.7));transition:opacity .5s;padding:3vmin}
#end.hidden{opacity:0;pointer-events:none}
.card{width:min(740px,94vw);max-height:94vh;overflow:auto;background:linear-gradient(160deg,rgba(40,22,80,.92),rgba(24,14,48,.94));border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:clamp(14px,3vmin,30px);box-shadow:0 20px 60px rgba(0,0,0,.45);display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(12px,2.5vmin,26px)}
@media (max-aspect-ratio:1/1){.card{grid-template-columns:1fr}}
.kicker{font-size:clamp(10px,1.8vmin,13px);color:#c9b6ff;letter-spacing:.12em}
.card h1{font-weight:400;font-size:clamp(24px,5vmin,40px);margin:.1em 0 .2em;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.stats{font-family:system-ui,sans-serif;font-size:clamp(11px,1.9vmin,14px);color:#ddd2ff;margin-bottom:.8em;line-height:1.5}
.stats b{color:#fff;font-weight:600}
#results{list-style:none;display:flex;flex-direction:column;gap:6px}
#results li{display:flex;align-items:center;gap:.6em;background:rgba(255,255,255,.06);border-radius:9px;padding:.4em .6em;font-size:clamp(12px,2.2vmin,16px)}
#results li .n{width:1.8em;text-align:center;color:#c9b6ff}
#results li.me{background:linear-gradient(90deg,var(--purple2),rgba(139,70,255,.35))}
#results li.p2{background:linear-gradient(90deg,var(--gold2),rgba(255,194,26,.3))}
#results li .g{margin-left:auto;opacity:.8;font-size:.85em}
.lobby .lt{font-size:clamp(13px,2.4vmin,18px);display:flex;flex-direction:column;gap:.4em;margin-bottom:.8em}
.lobby .lt small{font-size:.72em;color:#c9b6ff;font-family:system-ui,sans-serif;line-height:1.5}
#replay{grid-column:1/-1;justify-self:center;font:inherit;font-size:clamp(15px,3vmin,22px);color:#fff;border:0;border-radius:14px;padding:.55em 1.6em;background:linear-gradient(90deg,var(--purple2),var(--purple));box-shadow:0 5px 0 #3a1490;cursor:pointer}
#replay:active{transform:translateY(3px);box-shadow:0 2px 0 #3a1490}
/* yarış sırasında çıkış */
#quit{position:fixed;left:50%;bottom:calc(1.6vmin + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;font:inherit;font-size:clamp(10px,1.8vmin,13px);color:#fff;border:0;border-radius:99px;padding:.45em 1em;background:var(--panel);cursor:pointer;display:none}
#quit.on{display:block}
/* ses aç/kapat: solda, sıralama listesinin altında (alttaki yazıların üstüne binmez) */
#sesBtn{position:fixed;left:calc(1.6vmin + env(safe-area-inset-left));top:calc(var(--rowh) * 5 + 5vmin + env(safe-area-inset-top));z-index:9;font-size:clamp(10px,1.8vmin,13px);width:2.6em;height:2.6em;padding:.45em;border:0;border-radius:99px;background:var(--panel);color:#fff;cursor:pointer;display:grid;place-items:center}
#sesBtn svg{width:100%;height:100%}
/* lobide sıralama listesi yok: ses düğmesi sol alta iner (küçük ekranlarda oyuncu kartının üstüne binmesin) */
body.lobide #sesBtn{top:auto;bottom:calc(2vmin + env(safe-area-inset-bottom))}
/* sonuç ekranında ses düğmesi perdenin üstünde kalır (dokunulabilsin) ama sol alta iner (tabloya binmesin) */
#end:not(.hidden) ~ #sesBtn{z-index:11;top:auto;bottom:calc(2vmin + env(safe-area-inset-bottom))}
#sesBtn .carpi{display:none}
#sesBtn.kapali .carpi{display:inline}
#sesBtn.kapali .dalga{display:none}
#sesBtn.kapali{opacity:.7}
/* telefon dik tutulursa: yan çevir uyarısı */
#cevir{position:fixed;inset:0;z-index:20;display:none;place-items:center;text-align:center;padding:8vmin;background:#1a1230;color:#e6dcff;font-size:clamp(16px,5vmin,26px);line-height:1.5}
#cevir b{display:block;font-size:2.6em;margin-bottom:.2em}
@media (orientation:portrait) and (pointer:coarse){#cevir{display:grid}}
body.lobide #hud,body.lobide .pad{visibility:hidden}
#quit.sure{background:#c81e3a}
/* lobi: hazır → tema oylaması → araç seçimi */
#lobi{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:calc(2vmin + env(safe-area-inset-top)) calc(2vmin + env(safe-area-inset-right)) calc(2vmin + env(safe-area-inset-bottom)) calc(2vmin + env(safe-area-inset-left));
  background:radial-gradient(ellipse at center,rgba(25,12,45,.45),rgba(20,8,38,.85));transition:opacity .4s;overflow:auto}
#lobi.hidden{opacity:0;pointer-events:none}
.lb{width:min(860px,100%);display:flex;flex-direction:column;gap:clamp(8px,2vmin,16px);align-items:center;text-align:center}
.lb h2{font-weight:400;font-size:clamp(22px,6vmin,52px);color:#fff;-webkit-text-stroke:.03em #3b1680;text-shadow:0 .08em 0 #3b1680}
.lb .alt{font-family:system-ui,sans-serif;font-size:clamp(11px,2.2vmin,16px);color:#e6dcff;background:var(--panel);padding:.5em 1em;border-radius:12px;line-height:1.5}
.lb .alt b{color:#ffd23f}
.lb .sure{font-size:clamp(13px,2.6vmin,20px);color:#ffd23f}
.koltuklar{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(5px,1.2vmin,10px);width:100%}
.koltuk{border-radius:12px;padding:clamp(6px,1.4vmin,12px) 4px;display:flex;flex-direction:column;align-items:center;gap:.35em;font-size:clamp(10px,2vmin,15px);min-height:clamp(70px,16vmin,120px);justify-content:center;word-break:break-word}
.koltuk.insan{background:linear-gradient(170deg,var(--c),rgba(0,0,0,.3));box-shadow:0 3px 0 rgba(0,0,0,.3)}
.koltuk.ben{outline:3px solid #fff}
.koltuk.bos{border:2px dashed rgba(255,255,255,.28);color:rgba(255,255,255,.65);background:rgba(255,255,255,.04)}
.koltuk small{font-family:system-ui,sans-serif;font-size:.78em;opacity:.9}
.koltuk .hz{color:#9ff0b0}
.lbtn{font:inherit;font-size:clamp(16px,3.6vmin,30px);color:#fff;border:0;border-radius:16px;padding:.45em 1.5em;background:linear-gradient(90deg,var(--purple2),var(--purple));box-shadow:0 5px 0 #3a1490;cursor:pointer}
.lbtn.on{background:linear-gradient(90deg,#1f9a4c,#33c56b);box-shadow:0 5px 0 #136b33}
.lbtn:disabled,.kart2:disabled{opacity:.5;cursor:default}
.koltuk.uzak{opacity:.55}
.lbtn2{font:inherit;font-size:clamp(11px,2vmin,15px);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:.4em 1em;background:rgba(0,0,0,.25);cursor:pointer}
.secim{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.4vmin,12px);width:100%}
.kart2{font:inherit;color:#fff;cursor:pointer;border:3px solid transparent;border-radius:14px;background:rgba(30,20,55,.8);padding:5px;width:clamp(82px,14vmin,140px);display:flex;flex-direction:column;align-items:center;gap:.2em;font-size:clamp(10px,1.9vmin,14px)}
/* tema kartları tek satırda (telefonda kaydırmadan hepsi görünsün): genişlik ekrana bölünür */
.secim.temalar{flex-wrap:nowrap}
.kart2.tema{width:min(clamp(180px,34vmin,300px),calc((100vw - 8vmin) / 4 - 12px));flex:0 0 auto}
.secim.araclar{display:grid;grid-template-columns:repeat(5,auto);justify-content:center}
.kart2 img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:9px;background:#2a1f45}
.kart2.sec{border-color:#ffd23f;box-shadow:0 0 18px rgba(255,210,63,.45)}
.kart2 .kim{font-family:system-ui,sans-serif;font-size:.78em;color:#ddd2ff;min-height:1.3em}
.kart2 .oy{color:#ffd23f}
.lb .ust{width:100%;display:flex;justify-content:space-between;align-items:center}
/* lobi listesi */
.lliste{width:min(620px,100%);display:flex;flex-direction:column;gap:clamp(5px,1.2vmin,9px);max-height:42vh;overflow-y:auto}
.lsatir{display:flex;align-items:center;gap:.8em;background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:.55em .9em;font-size:clamp(12px,2.4vmin,17px);text-align:left}
.lsatir b{flex:1;color:#fff;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
// açılışta bir hata olursa yükleme perdesinde yazılır; oyun açıldıktan sonraki hatalar ekranı kapatmaz (yalnızca konsola düşer)
window.addEventListener('error', e => { const l = document.getElementById('loading'); if (l && !l.classList.contains('hidden')) l.textContent = 'Hata: ' + (e.message || e); });
// Tanı ekranı (?tani): telefonda sorun olursa dokunuşlar oyuna ulaşıyor mu, ekran donuyor mu, hata var mı görünsün.
// Köşedeki saat duruyorsa sayfa donmuştur; sayılar artmıyorsa dokunuş gelmiyordur.
(function () {
  const tani = /[?&]tani\b/.test(location.search), say = {}, hatalar = [];
  let son = '-', kare = 0, fps = 0;
  const kaydet = ad => e => { say[ad] = (say[ad] || 0) + 1; const t = e.target; son = ad + ' → ' + (t && t.id ? '#' + t.id : t && t.className ? '.' + String(t.className).split(' ')[0] : t && t.nodeName); };
  window.addEventListener('unhandledrejection', e => { const m = 'Söz hatası: ' + (e.reason && e.reason.message || e.reason); console.warn(m); if (tani) hatalar.push(m); });
  if (!tani) return;
  window.addEventListener('error', e => hatalar.push('Hata: ' + (e.message || e)));
  for (const ad of ['pointerdown', 'pointerup', 'pointercancel', 'touchstart', 'touchend', 'touchcancel', 'click', 'blur']) window.addEventListener(ad, kaydet(ad), { capture: true, passive: true });
  const kutu = document.createElement('div');
  kutu.style.cssText = 'position:fixed;left:4px;top:4px;z-index:99;max-width:70vw;font:11px/1.35 monospace;color:#fff;background:rgba(0,0,0,.78);padding:5px 7px;border-radius:6px;pointer-events:none;white-space:pre-wrap';
  document.body.appendChild(kutu);
  (function dongu() { kare++; requestAnimationFrame(dongu); })();
  let onceki = 0;
  setInterval(() => { fps = (kare - onceki) * 2; onceki = kare; }, 500);
  setInterval(() => {
    kutu.textContent = `TANI ${new Date().toLocaleTimeString()} · ${fps} kare/sn · ${innerWidth}x${innerHeight}\n` +
      `PointerEvent: ${!!window.PointerEvent} · ${navigator.userAgent.replace(/^.*?\(([^)]*)\).*$/, '$1')}\n` +
      Object.entries(say).map(([k, v]) => k + ':' + v).join(' ') + `\nson: ${son}` + (hatalar.length ? '\n' + hatalar.slice(-3).join('\n') : '');
  }, 250);
})();
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { sesKur } from './ses.js';
const SES = sesKur();   // motor, lastik, çarpma ve tehlike sesleri (ilk dokunuşta açılır)

/* =========================================================
   Ayarlar & yardımcılar
   ========================================================= */
const LAPS = 3;
const PERFECT_TIME = 210;  // kusursuz sürüşte (boş pist) 3 tur = 3.5 dk
const T_GO = 2.2;          // geri sayım bitişi (sn)
const W = 16, HW = W / 2;
const LANES = [-5.8, -2, 2, 5.8];
const UP = new THREE.Vector3(0, 1, 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
let seed = 20261122;
const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const sr = (a, b) => a + srand() * (b - a);
const ord = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
const DBG = new URLSearchParams(location.search);
const isTouch = DBG.has('touch') || matchMedia('(pointer:coarse)').matches;   // ?touch → telefon ayarları masaüstünde denenir
const TIME_SCALE = clamp(parseFloat(DBG.get('speed')) || 1, .05, 4);  // ?speed=0.3 → ağır çekim
const AUTO_ALL = DBG.has('auto');                                        // ?auto → oyuncu da otomatik pilot
const SOLO = DBG.has('solo');                                            // ?solo → ağsız tek kişilik deneme
// Çok oyunculu durum: on = ağ üzerinden yarış sürüyor; host = botları ve engelleri bu cihaz üretir.
const NET = { on: false, host: false, izleyici: false, ag: null, now: () => performance.now(), startAt: 0, sendT: 0, final: null };

/* =========================================================
   Renderer / sahne
   ========================================================= */
const canvas = document.getElementById('game');
// kenar yumuşatma (MSAA) efekt zincirinin kendi çizim hedefinde yapılır; ekranın kendi tamponunda yalnızca son
// tam ekran kare çizildiği için orada MSAA boşuna bellek ve bant genişliği harcıyordu (?low modunda açık kalır)
const renderer = new THREE.WebGLRenderer({ canvas, antialias: DBG.has('low'), powerPreference: 'high-performance' });
const PR = parseFloat(DBG.get('pr')) || Math.min(devicePixelRatio, isTouch ? 1.5 : 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .98;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const FOG = new THREE.Color(0xf1a28c);
scene.fog = new THREE.Fog(FOG, 170, 1150);
const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.5, 3200);

const SUN_DIR = new THREE.Vector3(-0.55, 0.1, -0.83).normalize();
const LIGHT_DIR = new THREE.Vector3(-0.5, 0.42, -0.75).normalize();
const hemi = new THREE.HemisphereLight(0xc2b0ff, 0x9a6448, 1.05); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffbf86, 2.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);   // gölge kenarları tırtıklı olmasın
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
// güneş (gölge kamerası) arabayı izler. Gökdelenli temalarda gölge kutusu genişler, öne kayar ve güneş
// uzağa konur: yoksa binaların üst katları gölge düşürmez, gölgeler yola yaklaşırken birden belirir.
const GOLGE = { kutu: 60, uzak: 200 }, gunesOn = new THREE.Vector3();
function golgeAyarla(kutu = 60, uzak = 200) {
  GOLGE.kutu = kutu; GOLGE.uzak = uzak;
  Object.assign(sun.shadow.camera, { left: -kutu, right: kutu, top: kutu, bottom: -kutu, near: 1, far: uzak + 220 });
  sun.shadow.normalBias = .04 * Math.max(1, kutu / 60); sun.shadow.camera.updateProjectionMatrix();
}
golgeAyarla();
function gunesKonumla(p) {
  sun.target.position.copy(p);
  if (GOLGE.kutu > 60) { camera.getWorldDirection(gunesOn); gunesOn.y = 0; gunesOn.normalize(); sun.target.position.addScaledVector(gunesOn, GOLGE.kutu * .45); }
  sun.position.copy(sun.target.position).addScaledVector(LIGHT_DIR, GOLGE.uzak);
}

/* ---------- dokular ---------- */
function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = isTouch ? Math.min(8, MAX_ANISO) : MAX_ANISO;   // telefonda 8x yeter (16x boşuna bant genişliği)
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function crownPath(g, cx, cy, s) {
  g.beginPath();
  g.moveTo(cx - s, cy + .55 * s); g.lineTo(cx - s, cy - .35 * s); g.lineTo(cx - .5 * s, cy + .05 * s);
  g.lineTo(cx, cy - .62 * s); g.lineTo(cx + .5 * s, cy + .05 * s); g.lineTo(cx + s, cy - .35 * s);
  g.lineTo(cx + s, cy + .55 * s); g.closePath();
}
function crown(g, cx, cy, s, fill) { crownPath(g, cx, cy, s); g.fillStyle = fill; g.fill(); }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }

const TEX = {
  road: canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = '#5d5661'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 6000; i++) { const b = Math.random() > .5; g.fillStyle = b ? `rgba(255,235,225,${Math.random() * .07})` : `rgba(10,0,15,${Math.random() * .1})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    for (const cx of [.13, .37, .63, .87]) { const gr = g.createLinearGradient((cx - .06) * w, 0, (cx + .06) * w, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, 'rgba(25,10,30,.16)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect((cx - .06) * w, 0, .12 * w, h); }
    g.fillStyle = '#f3eee4'; g.fillRect(w * .03, 0, w * .025, h); g.fillRect(w * .945, 0, w * .025, h);
    g.fillStyle = '#f4b92a'; g.fillRect(w * .5 - 5, 0, 10, h * .42);
    g.fillStyle = 'rgba(243,238,228,.8)'; g.fillRect(w * .25 - 3, h * .5, 6, h * .28); g.fillRect(w * .75 - 3, h * .5, 6, h * .28);
  }, true),
  kerb: canvasTex(16, 64, (g, w, h) => { g.fillStyle = '#d9322c'; g.fillRect(0, 0, w, h / 2); g.fillStyle = '#f6f1ea'; g.fillRect(0, h / 2, w, h / 2); }, true),
  check: canvasTex(1024, 128, (g, w, h) => {
    const s = 32; for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) { g.fillStyle = ((x + y) / s) % 2 ? '#15131c' : '#f4f1ea'; g.fillRect(x, y, s, s); }
    g.fillStyle = '#262238'; g.fillRect(w / 2 - 150, 0, 300, h); crown(g, w / 2, h / 2 + 6, 52, '#ffc21a');
  }),
  finish: canvasTex(64, 64, (g, w, h) => { const s = 16; for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) { g.fillStyle = ((x + y) / s) % 2 ? '#15131c' : '#f4f1ea'; g.fillRect(x, y, s, s); } }, true),
  plate: canvasTex(128, 64, (g, w, h) => { g.fillStyle = '#f3efe5'; rrect(g, 2, 2, w - 4, h - 4, 8); g.fill(); g.lineWidth = 4; g.strokeStyle = '#2a2530'; g.stroke(); crown(g, w / 2, h / 2 + 3, 20, '#2a2530'); }),
  pad: canvasTex(128, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.fillStyle = 'rgba(150,80,255,.35)'; rrect(g, 6, 0, w - 12, h, 18); g.fill();
    g.strokeStyle = '#d9c2ff'; g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round'; g.shadowColor = '#a066ff'; g.shadowBlur = 16;
    for (let i = 0; i < 2; i++) { const y = 70 + i * 128; g.beginPath(); g.moveTo(26, y + 30); g.lineTo(64, y - 18); g.lineTo(102, y + 30); g.stroke(); }
  }, true),
  smoke: canvasTex(64, 64, (g, w, h) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.45, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }),
};
function chevronTex(dir) {
  return canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = '#1b1820'; rrect(g, 0, 0, w, h, 16); g.fill();
    g.fillStyle = '#f7c12b'; rrect(g, 8, 8, w - 16, h - 16, 10); g.fill();
    g.fillStyle = '#1b1820';
    for (let i = 0; i < 2; i++) {
      const x = 70 + i * 80; g.save(); if (dir < 0) { g.translate(w, 0); g.scale(-1, 1); }
      g.beginPath(); g.moveTo(x - 24, 22); g.lineTo(x + 8, 22); g.lineTo(x + 44, 64); g.lineTo(x + 8, 106); g.lineTo(x - 24, 106); g.lineTo(x + 12, 64); g.closePath(); g.fill(); g.restore();
    }
  });
}
TEX.chevR = chevronTex(1); TEX.chevL = chevronTex(-1);
function bannerTex(col) {
  return canvasTex(128, 320, (g, w, h) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, 0); g.lineTo(w, 0); g.lineTo(w, h); g.lineTo(w / 2, h - 50); g.lineTo(0, h); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(0, 0, w, 18);
    crown(g, w / 2, 120, 38, '#ffc21a');
  });
}
const BANNERS = ['#6a34d8', '#d63c45', '#1f9c98', '#e49a1c'].map(bannerTex);
const BANNER_M = BANNERS.map(t => new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: .5, side: THREE.DoubleSide }));
function textSign(text, sub, bg = '#7a4a2c', fg = '#ffe9c2') {
  return canvasTex(512, 200, (g, w, h) => {
    g.fillStyle = bg; rrect(g, 0, 0, w, h, 24); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 10; g.stroke();
    for (let i = 0; i < 5; i++) { g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(0, i * 40 + 18, w, 3); }
    g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'bold 76px "Russo One", sans-serif'; g.fillText(text, w / 2, sub ? 82 : h / 2);
    if (sub) { g.font = '34px "Russo One", sans-serif'; g.fillText(sub, w / 2, 152); }
  });
}

/* ---------- geometri / malzeme önbelleği ---------- */
const cache = new Map();
// ortak önbellek: buradan gelen geometri/malzeme paylaşılır, hiçbir zaman atılmaz
const C = (k, fn) => { if (!cache.has(k)) { const o = fn(); o.userData.ortak = true; cache.set(k, o); } return cache.get(k); };
const rbox = (w, h, d, r = .2) => C(`rb${w},${h},${d},${r}`, () => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, Math.min(w, h, d) / 2 - .001)));
const box = (w, h, d) => C(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));
const cyl = (a, b, h, s = 16) => C(`c${a},${b},${h},${s}`, () => new THREE.CylinderGeometry(a, b, h, s));

/* =========================================================

    for (const c of o.children) {
      // gizli dal (altındakilerle birlikte) olduğu gibi kalır: birleştirilseydi gizli parçalar görünür olurdu
      if (c.userData.noMerge || !c.visible) continue;
      if (c.userData.dyn) { subs.push(c); continue; }
      // çizim sırası verilmiş (renderOrder) parçalar da ayrı kalır
      if (c.isMesh && !c.isInstancedMesh && !c.renderOrder && !Array.isArray(c.material) && !c.material.isShaderMaterial && c.geometry.attributes.normal) {

        if (!groups.has(key)) groups.set(key, []);

  for (const list of groups.values()) {
    if (list.length < 2) continue;
    const renkli = !!list[0].material.vertexColors;   // köşe renkli malzemede renkler de korunur
    const geos = list.map(o => {
      // indisli geometri indisli birleşir (köşeler çoğaltılmaz: yuvarlak kutu/küre 4–6 kat az köşe)
      const g = o.geometry.clone(); g.morphAttributes = {};
      for (const name of Object.keys(g.attributes)) if (name !== 'position' && name !== 'normal' && name !== 'uv' && !(renkli && name === 'color')) g.deleteAttribute(name);
      const mw = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld); g.applyMatrix4(mw);
      if (mw.determinant() < 0) yuzCevir(g);   // aynalanmış (eksi ölçekli) parça: yoksa yüzü karanlık görünürdü
      return g;

    // geometri yanlışlıkla atılırsa three.js onu bir sonraki kullanımda yeniden yükler)
    for (const o of list) { o.parent.remove(o); if (!o.geometry.userData.ortak) o.geometry.dispose(); removed++; }
  }
  for (const s of subs) removed += mergeTree(s);

// Ayna dönüşümü (eksi ölçek) birleştirmede geometriye işlenince üçgenlerin köşe sırası ters döner; three.js ön yüzü
// köşe sırasından anladığı için o yüzü arka yüz sayıp normalini çevirir (karanlık görünür). Köşe sırası düzeltilir.

/* =========================================================

/* --- Kale Yolu: yol kenarındaki fıçı istifi devrilir; fıçılar ilk şeride yuvarlanır, oradan ortaya yavaşça --- */
function barrelStack() {

    for (const z of [-.45, .45]) mk(roll, FXG.band, FXM.band, 0, 0, z, { r: [Math.PI / 2, 0, 0], cast: false });
    kenarlik(roll.children[0], 'kirmizi', .18);
    // üstteki fıçı ilk şeritte kalır, alttakiler bir şerit içeri kayar (aynı yerde üst üste binmesinler)
    const o = { x: side * (HW + 2.5), dir, v: 0, hizli: rand(9, 11), yavas: lvl ? 0 : 1.3 };

    update(dt) {
      t += dt;
      if (!go && items[0].s - me.s < 380) { go = true; ses = SES.gumburtu('fici'); SES.tok(items[0].g.position, { f0: 150, f1: 70, sure: .2, guc: .5, parlak: 1800, menzil: 60 }); }

  for (const [a, b] of [[-.45, -.7], [.45, -.7], [-.45, .7], [.45, .7]]) mk(g, box(.18, .8, .18), FXM.dark, a, .4, b, { cast: false });
  kenarlik(g.children[0], 'kirmizi', .16); kenarlik(g.children[1], 'kirmizi', .12);   // gövde ve baş

}

// küçük resimler kısa "blob:" adresleriyle verilir: lobi her yenilendiğinde uzun base64 metinleri yeniden çözülmesin
function blobAdres(dataUrl) {
  const [bas, veri] = dataUrl.split(','), ikili = atob(veri), a = new Uint8Array(ikili.length);
  for (let i = 0; i < ikili.length; i++) a[i] = ikili.charCodeAt(i);
  return URL.createObjectURL(new Blob([a], { type: bas.slice(5, bas.indexOf(';')) }));
}

// küçük resim: tuvalin o anki görüntüsü
function shot(src, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), k = Math.max(w / src.width, h / src.height);
  g.drawImage(src, (w - src.width * k) / 2, (h - src.height * k) / 2, src.width * k, src.height * k);
  return c.toDataURL('image/jpeg', .82);
}
// araç seçimi için her aracın küçük resmi (aynı çizici ile ayrı bir sahnede bir kez çizilir)
function carThumbs() {
  const W = 320, H = 200, rt = new THREE.WebGLRenderTarget(W, H);
  rt.texture.colorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x3a2a62);
  sc.add(new THREE.HemisphereLight(0xe8e0ff, 0x5a3a70, 2.2));
  const dl = new THREE.DirectionalLight(0xffffff, 2.6); dl.position.set(5, 8, 6); sc.add(dl);
  const cam = new THREE.PerspectiveCamera(28, W / H, .1, 100); cam.position.set(8.4, 4.6, 9.8); cam.lookAt(0, 1.25, 0);
  const buf = new Uint8Array(W * H * 4), c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), img = g.createImageData(W, H), out = {};
  for (const type of CAR_TYPES) {
    const car = makeCar(type, CAR_COL[type], false); car.root.rotation.y = -.55; sc.add(car.root);
    renderer.setRenderTarget(rt); renderer.render(sc, cam); renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf); renderer.setRenderTarget(null);
    for (let y = 0; y < H; y++) img.data.set(buf.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4);
    g.putImageData(img, 0, 0); out[type] = blobAdres(c.toDataURL('image/jpeg', .85));
    sc.remove(car.root); car.own.forEach(m => m.dispose());
    car.root.traverse(o => { if (o.geometry && !o.geometry.userData.ortak) o.geometry.dispose(); });   // bu araca özel geometriler de
  }
  rt.dispose();
  return out;
}

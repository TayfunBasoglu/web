<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oyun Odası</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #12141a;
      color: #e8eaf0;
    }
    .kart {
      width: 100%;
      max-width: 380px;
      background: #1c1f28;
      border: 1px solid #2c303c;
      border-radius: 14px;
      padding: 28px;
    }
    h1 { margin: 0 0 20px; font-size: 22px; }
    .sekmeler { display: flex; gap: 8px; margin-bottom: 20px; }
    .sekme {
      flex: 1;
      padding: 10px;
      border: 1px solid #2c303c;
      border-radius: 8px;
      background: transparent;
      color: #9aa1b2;
      font-size: 15px;
      cursor: pointer;
    }
    .sekme.aktif { background: #2a2f3d; color: #fff; border-color: #4a5168; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #9aa1b2; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #2c303c;
      border-radius: 8px;
      background: #12141a;
      color: #fff;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #5b8cff; outline-offset: -1px; }
    .ana-dugme {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #5b8cff;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .ana-dugme:disabled { opacity: .6; cursor: default; }
    .ikincil-dugme {
      padding: 8px 14px;
      border: 1px solid #2c303c;
      border-radius: 8px;
      background: transparent;
      color: #e8eaf0;
      font-size: 14px;
      cursor: pointer;
    }
    .hata { min-height: 20px; margin-top: 14px; font-size: 14px; color: #ff7b7b; }
    .ipucu { margin-top: 6px; font-size: 12px; color: #6f7687; }
    .ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .ust h1 { margin: 0; }
    ul { list-style: none; margin: 8px 0 0; padding: 0; }
    li { padding: 10px 12px; border: 1px solid #2c303c; border-radius: 8px; margin-top: 8px; }
    li.ben { border-color: #5b8cff; }
    .gizli { display: none; }
  </style>
</head>
<body>
  <div class="kart">

    <div id="ekran-yukleniyor">Yükleniyor...</div>

    <!-- Giriş / Kayıt -->
    <div id="ekran-giris" class="gizli">
      <h1>Oyun Odası</h1>
      <div class="sekmeler">
        <button type="button" class="sekme aktif" id="sekme-giris">Giriş yap</button>
        <button type="button" class="sekme" id="sekme-kayit">Kayıt ol</button>
      </div>
      <form id="form-giris">
        <label for="kullanici">Kullanıcı adı</label>
        <input id="kullanici" autocomplete="username" required>
        <div class="ipucu gizli" id="ipucu-kullanici">3-20 karakter; yalnızca harf, rakam ve alt çizgi.</div>

        <label for="sifre">Şifre</label>
        <input id="sifre" type="password" autocomplete="current-password" required>
        <div class="ipucu gizli" id="ipucu-sifre">En az 6 karakter.</div>

        <div id="alan-kod" class="gizli">
          <label for="kod">Davet kodu</label>
          <input id="kod" autocomplete="off">
        </div>

        <button class="ana-dugme" id="dugme-gonder">Giriş yap</button>
        <div class="hata" id="hata-giris"></div>
      </form>
    </div>

    <!-- Hesabı var ama üyeliği tamamlanmamış -->
    <div id="ekran-kod" class="gizli">
      <h1>Davet kodu gerekli</h1>
      <p>Hesabın açıldı ama üyeliğin tamamlanmadı. Davet kodunu yaz.</p>
      <form id="form-kod">
        <label for="kod2">Davet kodu</label>
        <input id="kod2" autocomplete="off" required>
        <button class="ana-dugme">Devam et</button>
        <div class="hata" id="hata-kod"></div>
      </form>
      <p><button type="button" class="ikincil-dugme" id="cikis2">Çıkış</button></p>
    </div>

    <!-- Giriş yapmış üye -->
    <div id="ekran-ana" class="gizli">
      <div class="ust">
        <h1>Merhaba, <span id="ben-ad"></span></h1>
        <button type="button" class="ikincil-dugme" id="cikis">Çıkış</button>
      </div>
      <div>Üyeler</div>
      <ul id="uye-listesi"></ul>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, signOut, deleteUser
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getDatabase, ref, get, set, onValue
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDOsCFHNwEpFBk_CNw-mf1kwxjNRPUDgK8",
      authDomain: "website-47054.firebaseapp.com",
      databaseURL: "https://website-47054-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "website-47054",
      storageBucket: "website-47054.firebasestorage.app",
      messagingSenderId: "366207205746",
      appId: "1:366207205746:web:72cdd942f88963ac1c5deb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Firebase e-posta istediği için kullanıcı adının sonuna bu eklenir.
    // Gerçek bir posta kutusu değildir.
    const EPOSTA_SONEKI = "@website-47054.firebaseapp.com";
    const epostaYap = (ad) => ad.toLowerCase() + EPOSTA_SONEKI;

    const $ = (id) => document.getElementById(id);
    const EKRANLAR = ["yukleniyor", "giris", "kod", "ana"];
    function goster(ad) {
      for (const e of EKRANLAR) $("ekran-" + e).classList.toggle("gizli", e !== ad);
    }

    let mod = "giris";          // "giris" ya da "kayit"
    let kayitSuruyor = false;   // kayıt adımları bitmeden ekran değişmesin
    let uyeDinleyici = null;

    function modDegistir(yeni) {
      mod = yeni;
      const kayit = mod === "kayit";
      $("sekme-giris").classList.toggle("aktif", !kayit);
      $("sekme-kayit").classList.toggle("aktif", kayit);
      $("alan-kod").classList.toggle("gizli", !kayit);
      $("ipucu-kullanici").classList.toggle("gizli", !kayit);
      $("ipucu-sifre").classList.toggle("gizli", !kayit);
      $("sifre").autocomplete = kayit ? "new-password" : "current-password";
      $("dugme-gonder").textContent = kayit ? "Kayıt ol" : "Giriş yap";
      $("hata-giris").textContent = "";
    }
    $("sekme-giris").onclick = () => modDegistir("giris");
    $("sekme-kayit").onclick = () => modDegistir("kayit");

    const izinYok = (e) => /permission[_ ]denied/i.test((e && e.code) + " " + (e && e.message));

    function hataMesaji(e) {
      if (e && e.ozel) return e.ozel;
      switch (e && e.code) {
        case "auth/email-already-in-use": return "Bu kullanıcı adı alınmış.";
        case "auth/weak-password": return "Şifre en az 6 karakter olmalı.";
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found": return "Kullanıcı adı ya da şifre yanlış.";
        case "auth/too-many-requests": return "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";
        case "auth/network-request-failed": return "Bağlantı kurulamadı. İnternetini kontrol et.";
        case "auth/operation-not-allowed": return "Firebase'de Email/Password girişi açık değil.";
        case "auth/admin-restricted-operation": return "Firebase'de yeni kayıt kapalı.";
        default: return "Bir hata oluştu: " + ((e && (e.code || e.message)) || "bilinmiyor");
      }
    }

    // Davet kodunu doğrulatır, sonra kullanıcı adını kaydeder.
    async function uyeOl(user, kod, ad) {
      try {
        await set(ref(db, "uyeler/" + user.uid), kod);
      } catch (e) {
        if (izinYok(e)) throw { ozel: "Davet kodu yanlış." };
        throw e;
      }
      await set(ref(db, "kullanicilar/" + user.uid), { ad });
    }

    async function ekraniGuncelle(user) {
      if (uyeDinleyici) { uyeDinleyici(); uyeDinleyici = null; }
      if (!user) { goster("giris"); return; }

      try {
        const uye = await get(ref(db, "uyeler/" + user.uid));
        if (!uye.exists()) { goster("kod"); return; }

        const adRef = ref(db, "kullanicilar/" + user.uid);
        let kayit = await get(adRef);
        let ad = kayit.exists() ? kayit.val().ad : null;
        if (!ad) {
          ad = user.email.split("@")[0];
          await set(adRef, { ad });
        }
        $("ben-ad").textContent = ad;

        uyeDinleyici = onValue(ref(db, "kullanicilar"), (snap) => {
          const liste = $("uye-listesi");
          liste.replaceChildren();
          snap.forEach((c) => {
            const li = document.createElement("li");
            li.textContent = (c.val() && c.val().ad) || "(isimsiz)";
            if (c.key === user.uid) li.classList.add("ben");
            liste.appendChild(li);
          });
        });
        goster("ana");
      } catch (e) {
        goster("giris");
        $("hata-giris").textContent = hataMesaji(e);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (!kayitSuruyor) ekraniGuncelle(user);
    });

    $("form-giris").addEventListener("submit", async (olay) => {
      olay.preventDefault();
      const ad = $("kullanici").value.trim();
      const sifre = $("sifre").value;
      const kod = $("kod").value.trim();
      const hata = $("hata-giris");
      const dugme = $("dugme-gonder");
      hata.textContent = "";

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(ad)) {
        hata.textContent = "Kullanıcı adı 3-20 karakter olmalı; yalnızca harf, rakam ve alt çizgi.";
        return;
      }
      if (mod === "kayit" && sifre.length < 6) { hata.textContent = "Şifre en az 6 karakter olmalı."; return; }
      if (mod === "kayit" && !kod) { hata.textContent = "Davet kodunu yaz."; return; }

      dugme.disabled = true;
      try {
        if (mod === "giris") {
          await signInWithEmailAndPassword(auth, epostaYap(ad), sifre);
        } else {
          kayitSuruyor = true;
          try {
            const sonuc = await createUserWithEmailAndPassword(auth, epostaYap(ad), sifre);
            try {
              await uyeOl(sonuc.user, kod, ad);
            } catch (e) {
              // Kod yanlışsa hesabı geri sil ki kullanıcı adı boşa çıksın.
              await deleteUser(sonuc.user).catch(() => {});
              throw e;
            }
          } finally {
            kayitSuruyor = false;
          }
          await ekraniGuncelle(auth.currentUser);
        }
      } catch (e) {
        if (auth.currentUser) await ekraniGuncelle(auth.currentUser);
        hata.textContent = hataMesaji(e);
      } finally {
        dugme.disabled = false;
      }
    });

    $("form-kod").addEventListener("submit", async (olay) => {
      olay.preventDefault();
      const user = auth.currentUser;
      const hata = $("hata-kod");
      hata.textContent = "";
      if (!user) { goster("giris"); return; }
      try {
        await uyeOl(user, $("kod2").value.trim(), user.email.split("@")[0]);
        await ekraniGuncelle(user);
      } catch (e) {
        hata.textContent = hataMesaji(e);
      }
    });

    $("cikis").onclick = () => signOut(auth);
    $("cikis2").onclick = () => signOut(auth);
  </script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Sahil Yolu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 48%,rgba(10,6,20,.6) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
button{font-family:inherit;color:#fff;cursor:pointer;outline:none}

#hud{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#spd{display:flex;align-items:baseline;gap:6px}
#spdN{font-size:clamp(28px,9vh,52px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#spd span{font-size:14px;font-weight:700;opacity:.85}
#info{font-size:13px;font-weight:600;opacity:.9;margin-top:4px}
#info b{font-variant-numeric:tabular-nums}

#topbar{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px}
#topbar button{width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(15,15,25,.45);font-size:20px;display:flex;align-items:center;justify-content:center}
#topbar button:active{background:rgba(255,255,255,.3)}

.pad{border:2px solid rgba(255,255,255,.4);background:rgba(15,18,28,.35);font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;letter-spacing:1px;transition:transform .05s}
.pad.on{background:rgba(255,255,255,.35);transform:scale(.95)}
#ctlL{position:fixed;left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));width:clamp(210px,40vw,370px);height:clamp(100px,38vh,185px);display:flex;border-radius:26px;overflow:hidden;border:2px solid rgba(255,255,255,.4);background:rgba(15,18,28,.3);touch-action:none}
#ctlL .half{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,8vh,46px);font-weight:900;color:#fff;transition:background .05s}
#ctlL .half+.half{border-left:1px solid rgba(255,255,255,.25)}
#ctlL .half.on{background:rgba(255,255,255,.32)}
#ctlR{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end}
#brake{width:clamp(72px,23vh,120px);height:clamp(72px,23vh,120px);border-radius:22px;background:rgba(170,25,35,.38);font-size:clamp(14px,4.2vh,22px)}
#gas{width:clamp(84px,25vh,130px);height:clamp(120px,44vh,220px);border-radius:24px;background:rgba(25,150,70,.38);font-size:clamp(16px,5vh,26px)}
#brake.on{background:rgba(255,60,70,.6)}
#gas.on{background:rgba(60,230,110,.6)}
#colB{display:flex;flex-direction:column;gap:12px;align-items:center}
#abil{display:none;width:clamp(72px,23vh,120px);height:clamp(46px,14vh,78px);border-radius:18px;font-size:clamp(12px,3.8vh,19px);background:rgba(120,60,200,.45)}
#abil.show{display:flex}
#abil.on{background:rgba(200,130,255,.9)!important;box-shadow:0 0 18px rgba(200,130,255,.8)}
#pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(255,255,255,.93);color:#222;padding:8px 16px;border-radius:16px;font-weight:800;font-size:clamp(13px,4vh,19px);opacity:0;transition:opacity .3s;pointer-events:none;max-width:80%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#vig.boost{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 40%,rgba(60,140,255,.55) 100%)}
#vig.ghost{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(110,255,210,.5) 100%)}

.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,8,24,.55);padding:12px}
.ov.show{display:flex}
.card{background:rgba(20,16,36,.86);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:18px 22px;text-align:center;max-width:900px;width:100%;max-height:100%;overflow-y:auto;touch-action:pan-y}
.card h1{font-size:clamp(24px,7vh,40px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ffd1b0,#ff9ec4,#a9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin-top:6px;font-size:15px;line-height:1.45;opacity:.92}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.big{border:none;border-radius:14px;padding:12px 22px;font-size:17px;font-weight:800;background:linear-gradient(135deg,#ff7a59,#ff4f8b);box-shadow:0 4px 14px rgba(255,80,120,.35)}
.big.alt{background:rgba(255,255,255,.14);box-shadow:none;border:1px solid rgba(255,255,255,.3)}
.big:active{transform:scale(.97)}
.card .hint{font-size:12.5px;opacity:.7;margin-top:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.veh{border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.veh .e{font-size:30px;line-height:1.1}
.veh .n{font-size:13px;font-weight:800}
.veh .d{font-size:10.5px;opacity:.7}
.veh.sel{border-color:#ff6fa8;background:rgba(255,90,150,.22);box-shadow:0 0 14px rgba(255,90,150,.35)}
@media (max-height:430px){
  .card{padding:10px 14px}
  .card p{font-size:13px;margin-top:2px}
  .veh{padding:5px 3px}.veh .e{font-size:24px}.veh .d{display:none}
  #grid{gap:6px;margin-top:8px}.card .row{margin-top:8px}
  .big{padding:9px 18px;font-size:15px}
  .card .hint{display:none}
}
#rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#120c20;text-align:center;padding:24px;font-size:18px;font-weight:700}
#rot.show{display:flex}
#rot .ic{font-size:64px;animation:rr 1.8s ease-in-out infinite}
@keyframes rr{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:10px 16px;border-radius:12px;font-size:14px;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>
<div id="flash"></div>

<div id="hud">
  <div id="spd"><b id="spdN">0</b><span>km/h</span></div>
  <div id="info">Mesafe <b id="distN">0.00</b> km &nbsp;·&nbsp; Rekor <b id="bestN">0.00</b> km</div>
</div>

<div id="topbar">
  <button id="bPause" title="Durdur / Başlat">▶</button>
  <button id="bReset" title="Sıfırla">⟲</button>
  <button id="bSound" title="Ses">🔊</button>
  <button id="bCam" title="Kamera: içeriden / arkadan">🎥</button>
  <button id="bFs" title="Tam ekran">⛶</button>
</div>

<div id="ctlL"><div class="half" id="pLeft">◀</div><div class="half" id="pRight">▶</div></div>
<div id="ctlR">
  <div id="colB"><button class="pad" id="abil"></button><button class="pad" id="brake">FREN</button></div>
  <button class="pad" id="gas">GAZ</button>
</div>
<div id="pop"></div>

<div id="ov" class="ov show">
  <div class="card">
    <h1 id="ovTitle">SAHİL YOLU</h1>
    <p id="ovTxt">Aracını seç ve trafiğe çarpmadan ne kadar uzağa gidebileceğini gör.</p>
    <div class="row">
      <button id="ovMain" class="big">BAŞLA</button>
      <button id="ovReset" class="big alt" style="display:none">⟲ SIFIRLA</button>
      <button id="ovGarage" class="big alt" style="display:none">🚘 ARAÇ DEĞİŞTİR</button>
      <button id="ovFs" class="big alt">⛶ TAM EKRAN</button>
    </div>
    <div id="grid"></div>
    <p class="hint">Sağ alt: GAZ / FREN &nbsp;·&nbsp; Sol alt: ◀ ▶ şerit değiştir<br>Klavye: ↑ gaz · ↓ / boşluk fren · ← → yön · P durdur · R sıfırla · C kamera</p>
  </div>
</div>

<div id="rot"><div class="ic">📱</div><div>Telefonu yan çevir</div><button class="big alt" id="rotFs">⛶ TAM EKRAN</button></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   ARAÇ LİSTESİ — YENİ ARAÇ EKLEMEK İÇİN BU LİSTEYE BİR NESNE EKLE
   ---------------------------------------------------------------------
   id      : benzersiz kısa ad (rekor bu adla saklanır)
   name    : menüde görünen ad,  emoji : menü simgesi,  desc : kısa açıklama
   phys    : hızlanma = A / (1 + (hız/K)^p) + min   (km/h/s, üst sınır yok)
             brake: fren gücü, drag: gaz bırakınca yavaşlama, steer: yan kayma hızı çarpanı
   cam     : y: göz yüksekliği (m), fov: görüş açısı, lean: virajda yatma, bob: süzülme, vib: titreşim
   hit     : çarpışma kutusu, yalnızca gövde (gidon, elcik, ayna, kanat, yandaki roket/itici, ileri uzanan sap hariç)
             w: yarı genişlik, front/back: kameradan öne/arkaya uzunluk (m)
   gears   : vites geçiş hızları (null = vitessiz, o zaman gearLabel gösterilir, rpmRef ile devir)
             rpmMax: göstergede yazan en yüksek devir (bin, varsayılan 14; dizeller için 2.8)
   snd     : motor sesi. o1/o2 dalga tipi, mul: 2. osilatör oranı, base+range*devir = frekans (Hz)
             lp/lpR: filtre, vol: motor sesi (0 = sessiz)
   dash    : gösterge renkleri. style: 'digital' veya 'analog'
   build   : kokpit modelini kurar (kamera koordinatında: -z ileri, -y aşağı). K yardımcılarını kullan.
             { root, steer, steerAxis, steerK } döndürür (steer = direksiyon/gidon nesnesi)
   Arkadan bakış için dış görünüm modeli: aşağıdaki EXTERIORS listesine aynı id ile eklenir.
   ===================================================================== */
const VEHICLES=[
  {id:'sport',name:'Spor Motor',emoji:'🏍️',desc:'Hızlı ve çevik',
   phys:{A:55,K:110,p:1.8,min:0.8,brake:95,drag:1,steer:1},
   cam:{y:1.25,fov:68,lean:0.042,bob:0,vib:1},hit:{w:0.25,front:1.2,back:0.8},
   gears:[55,95,135,175,225],
   snd:{o1:'sawtooth',o2:'square',mul:0.5,g2:0.25,base:36,range:150,lp:450,lpR:1300,vol:0.2},
   dash:{style:'digital',bg:'#04060a',frame:'#26303c',num:'#ffffff',unit:'#9fb3c4',bars:['#4fe3ff','#ffb020','#ff3344'],gearBg:'#0d2617',gearFg:'#57ff8a'},
   build:()=>sportBike({body:0x141518,dark:0x16171b,yoke:0x2a2b31,fork:0xc9a04e,accent:0x3fb54a,grip:0x0e0e10,barEnd:0xb4b4bc,house:0x0b0b0e,glass:0x2e3448})},

  {id:'car',name:'Araba',emoji:'🚗',desc:'Rahat ve dengeli',
   phys:{A:42,K:120,p:1.8,min:0.6,brake:85,drag:1,steer:0.85},
   cam:{y:1.15,fov:66,lean:0,bob:0,vib:0.5},hit:{w:0.92,front:2.4,back:2.1},
   gears:[50,90,130,170,215],
   snd:{o1:'sawtooth',o2:'square',mul:0.5,g2:0.35,base:30,range:110,lp:350,lpR:800,vol:0.14},
   dash:{style:'digital',bg:'#0a0d14',frame:'#333a48',num:'#e8f1ff',unit:'#8aa0b8',bars:['#5aa9ff','#ffd04a','#ff5050'],gearBg:'#11182a',gearFg:'#7fb8ff'},
   build:()=>carCockpit(0xb3122a)},

  {id:'barbie',name:'Barbie Motor',emoji:'💖',desc:'Pembe ve parıltılı',
   phys:{A:52,K:105,p:1.8,min:0.8,brake:95,drag:1,steer:1},
   cam:{y:1.25,fov:68,lean:0.045,bob:0,vib:0.8},hit:{w:0.25,front:1.2,back:0.8},
   gears:[55,95,135,175,225],
   snd:{o1:'sawtooth',o2:'triangle',mul:2,g2:0.3,base:60,range:200,lp:700,lpR:1800,vol:0.15},
   dash:{style:'digital',bg:'#2a0a1c',frame:'#ff7ac0',num:'#ffffff',unit:'#ffb3da',bars:['#ff9fd5','#ff4fa3','#ff1f7a'],gearBg:'#ff4fa3',gearFg:'#ffffff'},
   build:()=>sportBike({body:0xff4fa3,dark:0xe23d8e,yoke:0xffffff,fork:0xffd700,accent:0xffffff,grip:0xffffff,barEnd:0xffd700,house:0xffffff,glass:0xff9fd0,extra:barbieExtras})},

  {id:'bike',name:'Bisiklet',emoji:'🚲',desc:'Yavaş ama sakin',
   phys:{A:14,K:22,p:2,min:0.15,brake:60,drag:0.6,steer:0.8},
   cam:{y:1.55,fov:66,lean:0.03,bob:0,vib:0.6},hit:{w:0.2,front:1.25,back:0.6},
   gears:null,gearLabel:'🚲',rpmRef:40,
   snd:{o1:'sine',o2:'sine',mul:1,g2:0,base:0,range:0,lp:200,lpR:0,vol:0},
   dash:{style:'digital',bg:'#a9b49a',frame:'#4d5644',num:'#1d2418',unit:'#3a4532',bars:['#2d3626','#2d3626','#2d3626'],gearBg:'#97a289',gearFg:'#1d2418'},
   build:bicycleCockpit},

  {id:'scooter',name:'E-Scooter',emoji:'🛴',desc:'Elektrikli, sessiz',
   phys:{A:24,K:32,p:2,min:0.25,brake:70,drag:0.8,steer:0.9},
   cam:{y:1.65,fov:66,lean:0.025,bob:0,vib:0.7},hit:{w:0.2,front:0.8,back:0.5},
   gears:null,gearLabel:'⚡',rpmRef:60,
   snd:{o1:'sine',o2:'triangle',mul:2.01,g2:0.3,base:140,range:520,lp:2500,lpR:2500,vol:0.06},
   dash:{style:'digital',bg:'#05080a',frame:'#14c8b0',num:'#ffffff',unit:'#7de8d8',bars:['#14c8b0','#14c8b0','#ffcc33'],gearBg:'#06322c',gearFg:'#14f0d0'},
   build:scooterCockpit},

  {id:'space',name:'Uzay Motoru',emoji:'🚀',desc:'Süzülen, çok hızlı',
   phys:{A:80,K:180,p:1.6,min:2,brake:110,drag:0.8,steer:1.15},
   cam:{y:1.4,fov:70,lean:0.06,bob:0.035,vib:0.4},hit:{w:0.35,front:1.9,back:0.8},
   gears:null,gearLabel:'W',rpmRef:250,
   snd:{o1:'sawtooth',o2:'sine',mul:1.5,g2:0.6,base:70,range:260,lp:500,lpR:2500,vol:0.12},
   dash:{style:'digital',holo:true,bg:'#000000',frame:'#2ff3ff',num:'#9ffcff',unit:'#ff6ef5',bars:['#2ff3ff','#b36bff','#ff4ff0'],gearBg:'#081a24',gearFg:'#ff6ef5'},
   build:spaceCockpit},

  {id:'chopper',name:'Motorcu',emoji:'🤘',desc:'Klasik chopper',
   phys:{A:40,K:100,p:1.9,min:0.6,brake:85,drag:1,steer:0.9},
   cam:{y:1.2,fov:68,lean:0.035,bob:0,vib:1.4},hit:{w:0.28,front:1.7,back:0.9},
   gears:[50,90,130,170],dialMax:240,
   snd:{o1:'square',o2:'sawtooth',mul:0.5,g2:0.5,base:24,range:90,lp:300,lpR:900,vol:0.22},
   dash:{style:'analog',bg:'#1a1a1c',rim:'#d8d8de',face:'#f1e6cc',tick:'#222222',needle:'#c41e1e',num:'#222222'},
   build:chopperCockpit},

  {id:'truck',name:'Tır',emoji:'🚛',desc:'Ağır ve güçlü',
   phys:{A:20,K:80,p:1.8,min:0.35,brake:55,drag:1.2,steer:0.6},
   cam:{y:2.55,fov:64,lean:0,bob:0,vib:0.5},hit:{w:1.25,front:1.5,back:14},
   gears:[20,35,50,65,80,95,110,130],rpmMax:2.8,
   snd:{o1:'square',o2:'sawtooth',mul:0.5,g2:0.6,base:22,range:55,lp:220,lpR:600,vol:0.22},
   dash:{style:'digital',bg:'#0c0a04',frame:'#5a4a20',num:'#ffb000',unit:'#c08a20',bars:['#ffb000','#ff8000','#ff3300'],gearBg:'#2a1e04',gearFg:'#ffb000'},
   build:truckCockpit},

  /* ----- Özel yetenekli araçlar -----
     ability : sağ alttaki mor butonun işi. label: yazı, mode: 'tap' (bas), 'hold' (basılı tut, enerji harcar), 'toggle' (aç/kapa)
               cd: bekleme süresi, dur: etki süresi, start/update/end: ne yapacağı
     reset/update(dt,d): araca özel her kare çalışan kurallar,  leave: başka araca geçerken temizlik
     onHit(araç): çarpınca kaza yerine ne olacağı (true = kaza yok)
     dashInfo: göstergenin sol altında km yerine yazılacak bilgi */
  {id:'f1',name:'Formula 1',emoji:'🏎️',desc:'NİTRO ile fırla',
   phys:{A:70,K:160,p:1.7,min:1.2,brake:130,drag:1.2,steer:1.15,grip:8},
   cam:{y:0.8,fov:70,lean:0,bob:0,vib:0.8},hit:{w:0.9,front:3.7,back:1.6},
   gears:[70,120,165,210,255,300,345],
   snd:{o1:'sawtooth',o2:'square',mul:2,g2:0.2,base:70,range:300,lp:800,lpR:2600,vol:0.12},
   dash:{style:'digital',bg:'#000000',frame:'#444444',num:'#ffffff',unit:'#aaaaaa',bars:['#33ff66','#ffdd00','#ff2222'],gearBg:'#111111',gearFg:'#ff3b3b'},
   ability:{label:'NİTRO',mode:'tap',cd:7,dur:2.5,start(){SFX.boost();},update(dt){S.v+=70*dt;S.co.fov+=6;S.tint='boost';}},
   dashInfo:()=>S.ab.on?'NİTRO!':S.ab.cd>0?'NİTRO '+Math.ceil(S.ab.cd)+'s':'NİTRO HAZIR',
   build:f1Cockpit},

  {id:'taxi',name:'Taksi',emoji:'🚕',desc:'Konuşkan müşteri',
   phys:{A:40,K:120,p:1.8,min:0.6,brake:85,drag:1,steer:0.85},
   cam:{y:1.15,fov:66,lean:0,bob:0,vib:0.5},hit:{w:0.92,front:2.4,back:2.1},
   gears:[50,90,130,170,215],
   snd:{o1:'sawtooth',o2:'square',mul:0.5,g2:0.35,base:30,range:110,lp:350,lpR:800,vol:0.14},
   dash:{style:'taxi'},
   ability:{label:'KORNA',mode:'tap',cd:0.6,start(){SFX.horn();}},
   reset(){S.vs.talk=5;},
   update(dt){S.vs.talk-=dt;if(S.vs.talk<=0&&S.state==='run'){S.vs.talk=rnd(7,11);pop('💬 '+taxiLine(),3.2);}},
   build:taxiCockpit},

  {id:'bus',name:'Otobüs',emoji:'🚌',desc:'Duraktan yolcu al',
   phys:{A:18,K:70,p:1.8,min:0.3,brake:60,drag:1.1,steer:0.55},
   cam:{y:2.3,fov:66,lean:0,bob:0,vib:0.5},hit:{w:1.3,front:1.6,back:10.5},
   gears:[20,35,50,65,80,100],rpmMax:2.8,
   snd:{o1:'square',o2:'sawtooth',mul:0.5,g2:0.5,base:24,range:60,lp:240,lpR:600,vol:0.2},
   dash:{style:'digital',bg:'#06140a',frame:'#22aa55',num:'#3cff7a',unit:'#22aa77',bars:['#3cff7a','#ffd84a','#ff4a4a'],gearBg:'#0b2414',gearFg:'#3cff7a'},
   ability:{label:'KAPI',mode:'tap',cd:1,start(){busDoor();}},
   reset(){busReset();},update(dt,d){busUpdate(dt,d);},leave(){busStop.root.visible=false;},
   dashInfo:()=>'👥 '+S.vs.pax+' · Durak '+Math.max(0,Math.round(-busStop.z))+'m',
   build:busCockpit},

/* =====================================================================
   GÖKYÜZÜ OLAYLARI — YENİ OLAY EKLEMEK İÇİN BU LİSTEYE BİR NESNE EKLE
   ---------------------------------------------------------------------
   Olaylar tek tek oynar; biri bitince birkaç saniye sonra sıradaki başlar. Liste her turda
   karıştırılır, sırayla oynatılır, bitince yeniden karıştırılır (aynı olay arka arkaya gelmez).
   id   : benzersiz kısa ad,   name : açıklama (ekranda gösterilmez),   dur : süre (sn)
   build(): nesneleri kurar, { root, ... } döndürür (root sahneye eklenir, bitince silinir)
   tick(o,k,t,dt): her karede çağrılır. o: build'in döndürdüğü, k: 0→1 ilerleme, t: geçen sn
   Koordinatlar oyuncuya göre: +x sağ, +y yukarı, -z ileri (ufuk). Örnek görünür alan:
   z=-150'de x yaklaşık -200…200, y 0…100.   E.* yardımcıları aşağıda (glow, tail, hero, bird...)
   ===================================================================== */
const SKY_EVENTS=[
  {id:'meteor',name:'☄️ Meteor yağmuru!',dur:5.5,
   build(){
     const root=new THREE.Group(),m=[];
     for(let i=0;i<6;i++){
       const g=new THREE.Group();g.add(E.glow(0xfff0c0,11));g.add(E.tail(0xff9a40,90,2.4,0.75));
       g.rotation.z=-0.42;g.userData={x:rnd(-320,-40),y:rnd(110,170),z:-rnd(240,340),d:i*0.7+rnd(0,0.3)};
       g.visible=false;root.add(g);m.push(g);
     }
     return {root,m};
   },
   tick(o,k,t){for(const g of o.m){const u=g.userData,tt=t-u.d;g.visible=tt>0&&tt<2.8;if(g.visible)g.position.set(u.x+tt*190,u.y-tt*85,u.z);}}},

  {id:'ufo',name:'🛸 Uzaylılar inek kaçırıyor!',dur:13,
   build(){
     const root=new THREE.Group(),ufo=new THREE.Group();root.add(ufo);
     E.add(ufo,SPH,E.phong(0x9aa3b5),[0,0,0],[14,2.6,14]);
     E.add(ufo,HSPH,E.basic(0x7ff7ff,{transparent:true,opacity:0.75}),[0,1.5,0],[5.5,4.5,5.5]);
     const lights=new THREE.Group();ufo.add(lights);
     const cols=[0xff4040,0xffff40,0x40ff60,0x40c0ff,0xff40ff,0xffa040];
     for(let i=0;i<12;i++){const s=E.glow(cols[i%6],3.5),a=i/12*PI*2;s.position.set(Math.cos(a)*13.5,0,Math.sin(a)*13.5);lights.add(s);}
     const beam=new THREE.Mesh(new THREE.ConeGeometry(10,62,20,1,true),E.basic(0x9dff9d,{additive:true,opacity:0,side:THREE.DoubleSide}));
     beam.position.y=-31;ufo.add(beam);
     const cow=E.cow();cow.scale.setScalar(2.4);root.add(cow);
     return {root,ufo,lights,beam,cow};
   },
   tick(o,k,t){
     const HX=-60,Y=55,Z=-170;let x,y=Y;
     if(k<0.25)x=HX+(260-HX)*(1-k/0.25);
     else if(k<0.8)x=HX+Math.sin(t*1.3)*3;
     else{const q=(k-0.8)/0.2;x=HX-q*q*500;y=Y+q*q*160;}
     o.ufo.position.set(x,y+Math.sin(t*2.5)*1.5,Z);o.ufo.rotation.z=Math.sin(t*1.7)*0.08;
     o.lights.rotation.y=t*3;
     const bk=k>0.3&&k<0.75?Math.min(1,(k-0.3)*12,(0.75-k)*12):0;
     o.beam.material.opacity=bk*0.4;o.beam.visible=bk>0;
     const lift=Math.max(0,Math.min(1,(k-0.36)/0.36));
     o.cow.visible=k<0.73;
     o.cow.position.set(HX,1.9+lift*(Y-6),Z);o.cow.rotation.set(lift*3,lift*5,lift*2);
   }},

    dark:{value:0},moonOn:{value:0},moonDir:{value:new THREE.Vector3(0,1,0)}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',

  fragmentShader:'uniform vec3 top,mid,hor,sun,moonDir;uniform float dark,moonOn;varying vec3 vP;void main(){vec3 d=normalize(vP);float h=max(d.y,0.0);vec3 c=mix(hor,mid,smoothstep(0.0,0.16,h));c=mix(c,top,smoothstep(0.14,0.75,h));vec3 nc=mix(vec3(0.10,0.09,0.20),vec3(0.02,0.03,0.08),smoothstep(0.0,0.5,h));c=mix(c,nc,dark);float s=max(dot(d,sun),0.0);c+=vec3(1.0,0.72,0.55)*(pow(s,10.0)*0.22*(1.0-dark)+pow(s,700.0)*1.3);c+=vec3(0.75,0.85,1.0)*pow(s,90.0)*0.9*moonOn*dark;if(moonOn>0.5&&dot(d,moonDir)>0.9975)c=vec3(0.01,0.01,0.02);if(d.y<0.0)c=mix(hor,vec3(0.10,0.09,0.20),dark);gl_FragColor=vec4(c,1.0);}',
  side:THREE.BackSide,depthWrite:false,fog:false

const NIGHT=new THREE.Color(0x1a1733),HORC=new THREE.Color(HOR);let envDark=0;
function applyEnv(k){
  sky.material.uniforms.dark.value=k;
  hemi.intensity=0.95*(1-0.72*k);sunL.intensity=0.75*(1-0.9*k);fillL.intensity=0.35*(1-0.7*k);

// ---------- Yardımcılar ----------
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),_p=new THREE.Vector3(),_s=new THREE.Vector3();
function M(x,y,z,rx,ry,rz,sx,sy,sz){
  _e.set(rx||0,ry||0,rz||0);_q.setFromEuler(_e);_p.set(x||0,y||0,z||0);_s.set(sx||1,sy||1,sz||1);
  return new THREE.Matrix4().compose(_p,_q,_s);
}
// Parçaları tek geometriye birleştir (tek draw call, vertex renkli)
function merge(parts){
  const pos=[],nor=[],col=[],c=new THREE.Color();
  for(const pt of parts){
    const g=pt.g.index?pt.g.toNonIndexed():pt.g.clone();
    if(pt.m)g.applyMatrix4(pt.m);
    const P=g.attributes.position.array,N=g.attributes.normal.array;
    for(let i=0;i<P.length;i++){pos.push(P[i]);nor.push(N[i]);}
    // cf verilmişse renk köşe başına hesaplanır (ör. palmiye gövdesindeki halkalar)
    if(pt.cf)for(let i=0;i<P.length;i+=3){c.set(pt.cf(P[i],P[i+1],P[i+2]));col.push(c.r,c.g,c.b);}
    else{c.set(pt.c);for(let i=0;i<P.length/3;i++)col.push(c.r,c.g,c.b);}
    g.dispose();
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  out.computeBoundingSphere();
  return out;
}
function canvasTex(w,h,draw,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=ANISO;
  return t;
}
function speckle(g,w,h,base,amt,n){
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){
    const v=(Math.random()-.5)*amt;
    g.fillStyle=v>0?'rgba(255,255,255,'+v+')':'rgba(0,0,0,'+(-v)+')';
    g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*3);
  }
}
// Köşeleri yuvarlatılmış birim kutu (r: köşe yarıçapı, birim kutuya göre).
// Normaller köşe merkezinden hesaplanır; böylece kenarlarda keskin ışık kırığı oluşmaz.
function roundedBox(r,seg){
  const g=new THREE.BoxGeometry(1,1,1,seg,seg,seg),p=g.attributes.position,n=g.attributes.normal;
  const v=new THREE.Vector3(),c=new THREE.Vector3(),h=0.5-r;
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    c.set(Math.max(-h,Math.min(h,v.x)),Math.max(-h,Math.min(h,v.y)),Math.max(-h,Math.min(h,v.z)));
    v.sub(c).normalize();
    n.setXYZ(i,v.x,v.y,v.z);
    v.multiplyScalar(r).add(c);
    p.setXYZ(i,v.x,v.y,v.z);
  }
  return g;
}
const BOX=new THREE.BoxGeometry(1,1,1);
const RBOX=roundedBox(0.18,6);
const CYL=new THREE.CylinderGeometry(1,1,1,20);
const CYL6=new THREE.CylinderGeometry(1,1,1,6);
const SPH=new THREE.SphereGeometry(1,24,16);
const HSPH=new THREE.SphereGeometry(1,24,12,0,PI*2,0,PI/2);
const CONE=new THREE.ConeGeometry(1,1,20);
const TAPER=new THREE.CylinderGeometry(0.55,1,1,16); // K.rod ile: a ucunda r, b ucunda 0.55r
const SHARED=new Set([BOX,RBOX,CYL,CYL6,SPH,HSPH,CONE,TAPER]);

// ---------- Gösterge (dashboard) dokusu ----------
const dc=document.createElement('canvas');dc.width=256;dc.height=160;
const dg=dc.getContext('2d');
const dashTex=new THREE.CanvasTexture(dc);

/* ---------- Kokpit kurma araçları (K) ----------
   K.p(geo, renk, [x,y,z], [sx,sy,sz], [rx,ry,rz])  → parça
   K.mesh(parçalar, {mat:'phong'|'lambert'|'basic', shiny, transparent, opacity, additive}) → tek mesh
   K.screen(gen, yük, [x,y,z], [rx,ry,rz], kasaRengi, holo) → gösterge ekranı
   K.tor(R, kalınlık) halka,  K.heart(boy) kalp,  K.glass(...) ön cam */
const K={
  p:(g,c,pos,scl,rot)=>({g,c,m:M(pos[0],pos[1],pos[2],rot?rot[0]:0,rot?rot[1]:0,rot?rot[2]:0,scl?scl[0]:1,scl?scl[1]:1,scl?scl[2]:1)}),
  mesh(parts,o){
    o=o||{};
    const opt={vertexColors:true,side:o.side||THREE.FrontSide};
    if(o.transparent){opt.transparent=true;opt.opacity=o.opacity==null?0.5:o.opacity;opt.depthWrite=false;}
    if(o.additive)opt.blending=THREE.AdditiveBlending;
    let mat;
    if(o.mat==='basic')mat=new THREE.MeshBasicMaterial(opt);
    else if(o.mat==='lambert')mat=new THREE.MeshLambertMaterial(opt);
    else{opt.shininess=o.shiny==null?50:o.shiny;opt.specular=new THREE.Color(o.spec==null?0x333340:o.spec);mat=new THREE.MeshPhongMaterial(opt);}
    return new THREE.Mesh(merge(parts),mat);
  },
  screen(w,h,pos,rot,house,holo){
    const g=new THREE.Group();g.position.set(pos[0],pos[1],pos[2]);g.rotation.set(rot[0],rot[1]||0,rot[2]||0);
    if(house!=null){const b=new THREE.Mesh(BOX,new THREE.MeshPhongMaterial({color:house,shininess:80}));b.scale.set(w*1.15,h*1.17,0.035);b.position.z=-0.02;g.add(b);}
    const m=holo?new THREE.MeshBasicMaterial({map:dashTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,side:THREE.DoubleSide})
               :new THREE.MeshBasicMaterial({map:dashTex,fog:false});
    g.add(new THREE.Mesh(new THREE.PlaneGeometry(w,h),m));
    return g;
  },
  tor:(R,t)=>new THREE.TorusGeometry(R,t,10,36),
  // iki nokta arasında çubuk: K.rod(renk, [x,y,z], [x,y,z], yarıçap)
  rod(c,a,b,r){
    const A=new THREE.Vector3(a[0],a[1],a[2]),B=new THREE.Vector3(b[0],b[1],b[2]),d=B.clone().sub(A),len=d.length();
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
    return {g:CYL,c,m:new THREE.Matrix4().compose(A.add(B).multiplyScalar(0.5),q,new THREE.Vector3(r,len,r))};
  },
  heart(s){
    const h=new THREE.Shape();
    h.moveTo(0,-s);h.bezierCurveTo(s*0.2,-s*0.6,s,-s*0.3,s,s*0.25);h.bezierCurveTo(s,s*0.8,s*0.3,s*0.95,0,s*0.5);
    h.bezierCurveTo(-s*0.3,s*0.95,-s,s*0.8,-s,s*0.25);h.bezierCurveTo(-s,-s*0.3,-s*0.2,-s*0.6,0,-s);
    return new THREE.ShapeGeometry(h);
  },
  glass(color,opacity,pos,rotX,wb,wt,h){
    const s=new THREE.Shape();s.moveTo(-wb,0);s.lineTo(wb,0);s.lineTo(wt,h);s.quadraticCurveTo(0,h*1.12,-wt,h);s.lineTo(-wb,0);
    const m=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false,side:THREE.DoubleSide,fog:false}));
    m.position.set(pos[0],pos[1],pos[2]);m.rotation.x=rotX;return m;
  }
};

// Yumuşak kenarlı renk lekeleri (dokunun tekdüze görünmemesi için). Dikeyde tekrar eden dokularda
// dikiş görünmesin diye leke üst/alt kenarı aşarsa karşı kenara da çizilir.
function blotches(g,w,h,n,rMin,rMax,colors){
  for(let i=0;i<n;i++){
    const x=Math.random()*w,y=Math.random()*h,r=rnd(rMin,rMax),col=colors[(Math.random()*colors.length)|0];
    for(const dy of [-h,0,h]){
      if(y+dy+r<0||y+dy-r>h)continue;
      const gr=g.createRadialGradient(x,y+dy,0,x,y+dy,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.fillRect(x-r,y+dy-r,r*2,r*2);
    }
  }
}
function drawRoad(g,w,h){
  speckle(g,w,h,'#3c3d48',0.16,9000);
  blotches(g,w,h,40,20,90,['rgba(0,0,0,.07)','rgba(255,255,255,.035)','rgba(30,20,40,.06)']);
  const ppm=w/15,ppmY=h/24;
  // lastik izleri (her şeritte iki koyu bant)
  g.fillStyle='rgba(0,0,0,.13)';
  for(let k=0;k<4;k++){const cx=(k+0.5)*3.75*ppm;g.fillRect(cx-1.1*ppm,0,0.55*ppm,h);g.fillRect(cx+0.55*ppm,0,0.55*ppm,h);}
  // asfalt derzleri ve çatlaklar
  g.strokeStyle='rgba(12,12,18,.45)';g.lineWidth=1.5;
  for(let i=0;i<7;i++){
    let x=Math.random()*w,y=Math.random()*h;g.beginPath();g.moveTo(x,y);
    for(let j=0;j<6;j++){x+=rnd(-12,12);y+=rnd(10,30);g.lineTo(x,y);}
    g.stroke();
  }
  g.fillStyle='rgba(20,20,28,.35)';g.fillRect(0,h*0.37,w,3); // enine yama derzi
  // şerit boyası
  g.fillStyle='rgba(235,230,220,.92)';
  g.fillRect(0.25*ppm,0,0.18*ppm,h);g.fillRect(w-0.43*ppm,0,0.18*ppm,h);
  for(let k=1;k<4;k++){const x=k*3.75*ppm-0.08*ppm;g.fillRect(x,0,0.16*ppm,3*ppmY);g.fillRect(x,12*ppmY,0.16*ppm,3*ppmY);}
  // boya aşınması: çizgilerin üzerine asfalt renginde serpinti
  for(let i=0;i<1400;i++){g.fillStyle='rgba(60,61,72,'+rnd(0.2,0.6)+')';g.fillRect(Math.random()*w,Math.random()*h,1,1+Math.random()*2);}
  // kesik çizgilerin arasında reflektörler (kedi gözü)
  g.fillStyle='rgba(255,240,200,.95)';
  for(let k=1;k<4;k++){const x=k*3.75*ppm-1.5;for(const m of [7.5,19.5])g.fillRect(x,m*ppmY,3,5);}
}

}

function frond(len,wid,droop){
  const g=new THREE.PlaneGeometry(len,wid,6,1);
  g.translate(len/2,0,0);g.rotateX(-PI/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const t=p.getX(i)/len;
    p.setZ(i,p.getZ(i)*(1-t*0.85)*(0.4+0.6*Math.sin(Math.min(1,t*3)*PI/2)));
    p.setY(i,-droop*t*t*len+Math.abs(p.getZ(i))*0.3);
  }
  g.computeVertexNormals();
  return g;
}

  const tp=tr.attributes.position;

function hillGeo(seed,peak){
  const g=new THREE.SphereGeometry(1,40,16,0,PI*2,0,PI/2),p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i),a=Math.atan2(z,x);
    const n=1+0.18*Math.sin(a*3+seed)+0.1*Math.sin(a*7+seed*2.3)+0.05*Math.sin(a*13+seed*5.1);
    const ny=y*(peak?Math.pow(y,0.6):1)*(0.85+0.3*Math.sin(a*2+seed*1.7));
    p.setXYZ(i,x*n,ny*n,z*n);

  const nr=g.attributes.normal,col=[],c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const h=Math.min(1,p.getY(i)/0.9),steep=1-nr.getY(i),r=hash(p.getX(i)*7+seed,p.getZ(i)*7);

// Köşeleri yuvarlatılmış yan profil (noktalar: [boy ekseni, yükseklik])
function roundedProfile(pts,r){
  const s=new THREE.Shape(),n=pts.length;
  const toward=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
  for(let i=0;i<n;i++){
    const p=pts[i],a=pts[(i-1+n)%n],b=pts[(i+1)%n];
    const p1=toward(p,a,Math.min(0.45,r/Math.hypot(p[0]-a[0],p[1]-a[1])));
    const p2=toward(p,b,Math.min(0.45,r/Math.hypot(b[0]-p[0],b[1]-p[1])));
    if(i===0)s.moveTo(p1[0],p1[1]);else s.lineTo(p1[0],p1[1]);
    s.quadraticCurveTo(p[0],p[1],p2[0],p2[1]);
  }
  s.closePath();
  return s;
}

}

  const s=c.grp.scale.x,dz=c.opp?-c.hz:c.hz;
  _shP.set(c.x,0.03,c.z+dz);_shS.set(c.hw*2.6*s,1,c.hl*2.3*s);
  shadows.setMatrixAt(shadowN++,_shM.compose(_shP,_shQ,_shS));
  const f=c.mini?0:lampFade(c.z);
  if(f<=0)return;
  const pts=c.opp?headPts:tailPts,rgb=c.opp?HEAD_RGB:TAIL_RGB,[lx,ly]=(c.opp?HEAD_POS:TAIL_POS)[c.type];
  const z=c.z+(c.opp?c.hl-c.hz:c.hz+c.hl)+0.03; // her iki durumda da bize bakan uç
  const pos=pts.geometry.attributes.position,col=pts.geometry.attributes.color;
  let i=c.opp?headN:tailN;
  for(const sx of [-lx,lx]){pos.setXYZ(i,c.x+sx,ly+c.y,z);col.setXYZ(i,rgb[0]*f,rgb[1]*f,rgb[2]*f);i++;}
  if(c.opp)headN=i;else tailN=i;
}
function endCarFx(){
  shadows.count=shadowN;shadows.instanceMatrix.needsUpdate=true;
  for(const [p,n] of [[tailPts,tailN],[headPts,headN]]){
    p.geometry.setDrawRange(0,n);
    p.geometry.attributes.position.needsUpdate=true;p.geometry.attributes.color.needsUpdate=true;
  }
}

function dressCar(c){
  const r=Math.random();
  let type=r<0.62?0:r<0.84?1:2;
  if(type===2&&!c.opp&&c.lane<2)type=0;
  const g=carGeo(type,COLORS[(Math.random()*COLORS.length)|0]);
  c.b.geometry=g.b;c.l.geometry=g.l;c.hl=g.hl;c.hw=g.hw;c.hz=g.hz;c.type=type;c.ht=[1.45,1.95,3.7][type];
  // önceki efektleri temizle (savrulma, yanma, küçülme, şerit değişimi)
  c.fly=null;c.burn=null;c.mini=false;c.tx=null;c.y=0;
  c.b.material=carMat;c.l.visible=true;c.grp.scale.setScalar(1);c.grp.rotation.set(0,c.opp?PI:0,0);
}

const glowTex=radialTex([[0,'rgba(255,255,255,1)'],[0.25,'rgba(255,255,255,.75)'],[1,'rgba(255,255,255,0)']]);

const WING_L=triGeo([0.35,0,0,-0.25,0,0,-0.05,0,1.3]),WING_R=triGeo([0.35,0,0,-0.05,0,-1.3,-0.25,0,0]);
SHARED.add(WING_L);SHARED.add(WING_R);
const E={
  lam:(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c,fog:false},o||{})),
  phong:c=>new THREE.MeshPhongMaterial({color:c,fog:false,shininess:80,specular:0x666666}),
  basic(c,o){
    o=o||{};const m=new THREE.MeshBasicMaterial({color:c,fog:false,side:o.side||THREE.FrontSide});
    if(o.transparent||o.additive){m.transparent=true;m.opacity=o.opacity==null?1:o.opacity;m.depthWrite=false;}
    if(o.additive)m.blending=THREE.AdditiveBlending;
    return m;
  },
  add(parent,geo,mat,pos,scl,rot){
    const m=new THREE.Mesh(geo,mat);
    if(pos)m.position.set(pos[0],pos[1],pos[2]);if(scl)m.scale.set(scl[0],scl[1],scl[2]);if(rot)m.rotation.set(rot[0],rot[1],rot[2]);
    parent.add(m);return m;
  },
  // parlak ışık topu
  glow(c,size,op){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false,opacity:op==null?1:op}));
    s.scale.set(size,size,1);return s;
  },
  // arkaya (-x) uzanan parlak kuyruk
  tail(c,len,rad,op){
    const g=new THREE.ConeGeometry(rad,len,10,1,true);g.rotateZ(PI/2);g.translate(-len/2,0,0);
    return new THREE.Mesh(g,E.basic(c,{additive:true,opacity:op,side:THREE.DoubleSide}));
  },
  // ışık izi: döndürülen fonksiyonu her karede (x,y,z) ile çağır
  trail(parent,c,n,size){
    // son 2n konumu halka tamponda tutar (her karede yeni dizi oluşturmaz)
    const sp=[],len=n*2,buf=new Float32Array(len*3);let head=-1,count=0;
    for(let i=0;i<n;i++){const s=E.glow(c,size*(1-i/n*0.7),0);parent.add(s);sp.push(s);}
    return (x,y,z)=>{
      head=(head+1)%len;buf[head*3]=x;buf[head*3+1]=y;buf[head*3+2]=z;count=Math.min(count+1,len);
      for(let i=0;i<n;i++){
        const j=((head-Math.min(count-1,i*2))%len+len)%len;
        sp[i].position.set(buf[j*3],buf[j*3+1],buf[j*3+2]);sp[i].material.opacity=(1-i/n)*0.8;
      }
    };
  },
  // renkli duman izi (Türk Yıldızları): döndürülen fonksiyonu her karede (x,y,z,dt) ile çağır
  smokeTrail(parent,c,n,size,iv){
    const sp=[],hist=[];let acc=0;
    for(let i=0;i<n;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,transparent:true,depthWrite:false,fog:false,opacity:0}));s.visible=false;parent.add(s);sp.push(s);}
    return (x,y,z,dt)=>{
      acc+=dt;if(acc>=iv||!hist.length){acc=0;hist.unshift([x,y,z]);if(hist.length>n)hist.pop();}
      for(let i=0;i<n;i++){
        const s=sp[i],h=hist[i];if(!h){s.visible=false;continue;}
        s.visible=true;s.position.set(h[0],h[1],h[2]);const f=i/n,sz=size*(0.6+f*1.6);s.scale.set(sz,sz,1);s.material.opacity=0.85*(1-f);
      }
    };
  },
  pig(){
    const g=new THREE.Group(),pk=E.lam(0xffa3c4),dk=E.lam(0xf07aa6);
    E.add(g,SPH,pk,[0,0,0],[1,0.62,0.62]);
    E.add(g,SPH,pk,[0.95,0.15,0],[0.45,0.42,0.42]);
    E.add(g,CYL,dk,[1.38,0.1,0],[0.2,0.12,0.2],[0,0,PI/2]);
    for(const s of [-1,1]){

      E.add(g,SPH,E.basic(0x111111),[1.28,0.3,s*0.18],[0.05,0.05,0.05]);

    return g;
  },
  // ejderha (+x yönüne bakar; userData.w: kanatlar, userData.tail: kuyruk parçaları)
  // Ejderha (+x yönüne bakar, ağız ucu ~(8.8, 2.75, 0)). userData.w: kanatlar [sol(+z), sağ(-z)],
  // userData.tail: kuyruk halkaları (y'leri dalgalandırılabilir, taban y=0)
  dragon(){
    const d=new THREE.Group(),SC=0x7a1414,BELLY=0xc9a26b,HORN=0xe8d8b0,BONE=0x3a0a0a;
    const P=[
      K.p(SPH,SC,[0,0,0],[4.2,1.7,1.6]),K.p(SPH,BELLY,[0.2,-0.6,0],[3.8,1.15,1.3]),K.p(SPH,SC,[2.8,0.35,0],[1.7,1.5,1.4]), // gövde, karın, göğüs
      K.p(SPH,SC,[7.0,3.0,0],[0.95,0.62,0.62]),                                    // kafatası
      K.p(CONE,SC,[7.95,2.88,0],[0.4,1.5,0.32],[0,0,-PI/2]),                       // burun
      K.p(RBOX,0x4a0a0a,[7.75,2.55,0],[1.3,0.18,0.5],[0,0,-0.12])                  // alt çene
    ];
    // S kıvrımlı boyun: halkalar, altta açık renkli karın pulları, üstte dikenler
    [[4.2,1.0,1.0],[4.9,1.6,0.86],[5.5,2.2,0.74],[6.05,2.62,0.64],[6.5,2.9,0.56]].forEach(([x,y,r])=>{

    for(const s of [-1,1]){
      P.push(K.p(CONE,HORN,[6.55,3.45,s*0.32],[0.12,1.2,0.12],[s*0.25,0,0.95]),K.p(CONE,HORN,[6.75,3.35,s*0.45],[0.07,0.6,0.07],[s*0.5,0,1.1])); // boynuzlar
      P.push(K.rod(SC,[2.4,-0.6,s*0.95],[2.2,-1.5,s*1.05],0.28),K.rod(SC,[2.2,-1.5,s*1.05],[1.6,-1.9,s*1.05],0.2),K.p(CONE,HORN,[1.35,-1.95,s*1.05],[0.08,0.4,0.08],[0,0,PI/2]));     // ön ayak (uçarken geriye kıvrık)
      P.push(K.rod(SC,[-2.0,-0.5,s*1.0],[-2.6,-1.6,s*1.1],0.42),K.rod(SC,[-2.6,-1.6,s*1.1],[-3.6,-1.9,s*1.1],0.25),K.p(CONE,HORN,[-3.95,-1.95,s*1.1],[0.09,0.45,0.09],[0,0,PI/2])); // arka ayak
    }
    d.add(K.mesh(P,{shiny:35,spec:0x442222}));
    for(const s of [-1,1]){const e=E.glow(0xffd640,0.45);e.position.set(7.35,3.18,s*0.42);d.add(e);} // gözler
    // kuyruk: incelen halkalar; ucunda yatay ok başı
    const tm=E.lam(SC),tail=[];
    for(let i=0;i<7;i++){const r=1.15-i*0.13;tail.push(E.add(d,SPH,tm,[-4.3-i*1.25,0,0],[r*1.1,r,r]));}
    E.add(tail[6],CONE,E.lam(BONE,{side:THREE.DoubleSide}),[-2.2,0,0],[0.2,3.0,1.6],[0,0,PI/2]); // son halkanın ölçeği telafi edildi
    // Yarasa kanadı: omuz-dirsek-bilek kemiği, bilekten açılan dört parmak; zar parmak uçları arasında içe kavisli
    const J={el:[-0.6,1.3,3.0],wr:[-0.2,0.9,5.6],tips:[[1.6,0.5,9.6],[-1.4,0.2,10.6],[-4.0,-0.2,9.2],[-5.6,-0.5,6.2],[-3.8,-0.1,0.4]]};
    const memMat=new THREE.MeshLambertMaterial({color:0x5c1010,side:THREE.DoubleSide});
    const wing=s=>{
      const z=p=>[p[0],p[1],p[2]*s],O=[0,0,0],g=new THREE.Group();

      const pos=[],tri=(a,b,c)=>pos.push(...z(a),...z(b),...z(c));
      tri(O,J.el,J.wr);tri(O,J.wr,J.tips[4]); // omuz ile bilek arası
      for(let i=0;i<J.tips.length-1;i++){
        const a=J.tips[i],b=J.tips[i+1],m=[0,1,2].map(k=>(a[k]+b[k])/2*0.78+J.wr[k]*0.22); // kenarı bileğe doğru çek

      g.add(new THREE.Mesh(geo,memMat));

// Bir nesne ağacının geometri / malzeme / dokularını serbest bırakır (ortak olanlar hariç)
function disposeTree(root){
  root.traverse(n=>{
    if(n.geometry&&!SHARED.has(n.geometry))n.geometry.dispose();
    if(!n.material)return;
    for(const m of [].concat(n.material)){
      if(m.userData.keep)continue; // ortak malzemeler (araç boyası vb.)
      if(m.map&&m.map!==glowTex&&m.map!==dashTex)m.map.dispose();
      m.dispose();
    }
  });
}

// ---------- Gökyüzü olayı zamanlayıcısı ----------
// Olaylar tek tek oynar: biri bitince gökyüzü SKY_PAUSE saniye boş kalır, sonra sıradaki başlar.
const SKY_PAUSE=4;
let skyActive=[],skyQueue=[],skyLast='';
// Karışık sıra: listeyi karıştırır, ilk eleman bir önceki turun sonuncusu (lastId) olmasın
function shuffledQueue(list,lastId){
  const q=list.slice();
  for(let i=q.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[q[i],q[j]]=[q[j],q[i]];}
  if(q.length>1&&q[0].id===lastId)q.push(q.shift());
  return q;
}
function nextSkyEvent(){
  if(!skyQueue.length)skyQueue=shuffledQueue(SKY_EVENTS,skyLast);
  return skyQueue.shift();
}
function startSky(id){
  endSky(); // aynı anda tek olay
  const ev=(id&&SKY_EVENTS.find(e=>e.id===id))||nextSkyEvent();
  const o=ev.build();
  skyRoot.add(o.root);
  skyActive.push({ev,o,t:0});
  skyLast=ev.id;
  ev.tick(o,0,0,0);
}
function endSkyOne(a){
  if(a.ev.end)a.ev.end(a.o);
  skyRoot.remove(a.o.root);
  disposeTree(a.o.root);
  skyActive=skyActive.filter(x=>x!==a);
}
function endSky(){skyActive.slice().forEach(endSkyOne);}
function updateSky(dt){
  skyRoot.position.x=S.x;
  if(!skyActive.length){
    S.skyNext-=dt;
    if(S.skyNext<=0)startSky();
  }
  for(let i=skyActive.length-1;i>=0;i--){ // geriye doğru: biten olay listeden çıkarken kayma olmasın
    const a=skyActive[i];
    a.t+=dt;
    const k=a.t/a.ev.dur;
    if(k<1){a.ev.tick(a.o,k,a.t,dt);continue;}
    endSkyOne(a);
    S.skyNext=SKY_PAUSE;
  }
  // olay gökyüzünü karartmak istiyorsa (o.dark: 0–1) yumuşakça uygula
  const dk=skyActive.length?skyActive[0].o.dark||0:0;
  if(Math.abs(dk-envDark)>0.001){envDark+=(dk-envDark)*Math.min(1,dt*1.5);applyEnv(envDark);}
}

/* =====================================================================
   YOL OLAYLARI — oyuncunun tepki vermesi gereken olaylar. YENİ OLAY EKLEMEK İÇİN LİSTEYE EKLE
   ---------------------------------------------------------------------
   Oyun sürerken 30–50 sn arayla tek tek gelir (karışık sıra, aynısı arka arkaya gelmez).
   Ekrana yazı çıkarmazlar; oyuncu olayı yolda görüp tepki verir.
   build(o)  : nesneleri o.root'a kurar. o.root dünyayla birlikte akar; yerel z=0 olayın yolda
               başladığı nokta, ileri (uzak) -z. o içine olayın kendi alanları yazılabilir.
   tick(o,dt): her kare; olay bitince false döndürür.
   Yardımcılar: playerHit() oyuncuya değiyor mu, avoidLanes() trafiği şeritten kaçırır,
               pickLanes() rastgele bitişik şeritler, laneSpan() şeritlerin x aralığı
   ===================================================================== */
function playerHit(x,z,hw,hl){return Math.abs(x-S.x)<hw+V.hit.w&&z-hl<V.hit.back&&z+hl>-V.hit.front;}
function pickLanes(n){const a=(Math.random()*(LANES.length-n+1))|0;return Array.from({length:n},(_,i)=>a+i);}
function laneSpan(lanes){return [LANES[lanes[0]]-1.875,LANES[lanes[lanes.length-1]]+1.875];}
// zNear..zFar (dünya z) bölgesine yaklaşan / içindeki araçlar boş şeride geçer; yer yoksa trafikten çekilir
function avoidLanes(lanes,zNear,zFar){
  for(const c of cars){
    if(!c.on||c.fly||c.burn!=null||!lanes.includes(c.lane)||c.z>zNear+10||c.z<zFar-150)continue;
    let best=-1;
    for(let l=0;l<LANES.length;l++){
      if(lanes.includes(l)||!laneFree(l,c))continue;
      if(best<0||Math.abs(LANES[l]-c.x)<Math.abs(LANES[best]-c.x))best=l;
    }
    if(best>=0){c.lane=best;c.tx=LANES[best];}else{c.on=false;c.grp.visible=false;}
  }
}
// Oyuncuyu dünyada ileri taşır (uzaylı ışını): yol, dekor, trafik ve durak birlikte kayar
function teleport(dist){
  moveWorld(dist);
  for(const c of cars){
    if(!c.on)continue;
    c.z+=dist;
    if(c.z>-30&&c.z<30&&Math.abs(c.x-S.x)<c.hw+V.hit.w+1)spawnCar(c,false); // tam üstüne düşen araç kaldırılır
  }
  for(const c of oppCars)c.z+=dist;
  if(busStop&&busStop.root.visible)busStop.z+=dist;
}

  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

    if(want)ab.energy=Math.max(0,ab.energy-dt*A.drain);else ab.energy=Math.min(1,ab.energy+dt*A.regen);

    if(ab.on&&A.update)A.update(dt);
  }else if(A.mode==='toggle'){
    if(pressed){ab.on=!ab.on;if(ab.on){if(A.start)A.start();}else if(A.end)A.end();}

    if(ab.on){ab.t+=dt;if(A.update)A.update(dt,Math.min(1,ab.t/A.dur));if(ab.t>=A.dur){ab.on=false;if(A.end)A.end();}}

  if(RIG){camera.remove(RIG.root);disposeTree(RIG.root);}

function resetWorld(){
  S.v=0;S.x=1.875;S.lat=0;S.lean=0;S.dist=0;S.maxV=0;S.crashT=0;S.shake=0;
  endSky();S.skyNext=6;envDark=0;applyEnv(0);
  endRoad();S.roadNext=rnd(ROAD_GAP_MIN,ROAD_GAP_MAX);S.airH=S.airV=0;
  stopAbility();S.vs={};S.passThru=false;S.tint='';clearFx();popT=0;popEl.style.opacity=0;
  flashOpacity=0;flash.style.opacity=0;vigOpacity='0';vig.style.opacity=0;vig.className='';

  for(const c of cars){c.on=false;c.grp.visible=false;}
  for(let i=0;i<TRAFFIC_BASE;i++)spawnCar(cars[i],true);
  for(const c of oppCars)spawnOpp(c,true);
  updateTraffic(0,0,false); // gölge ve lambaları yeni yerlerine koy (menü görüntüsü için)

// Kamera: 'fp' sürücü gözünden (kokpit), 'tp' arkadan takip (aracın dış modeli görünür)
let camMode=store.get('sahilyolu_cam')==='fp'?'fp':'tp',EXT=null; // varsayılan: arkadan bakış
function applyCamMode(){
  RIG.root.visible=camMode==='fp';EXT.root.visible=camMode==='tp';
  bCam.textContent=camMode==='tp'?'👁':'🎥';
  dirty=true;
}
function toggleCam(){camMode=camMode==='fp'?'tp':'fp';store.set('sahilyolu_cam',camMode);applyCamMode();}
function crashK(){return S.state==='crash'||S.state==='over'?Math.min(1,S.crashT/0.7):0;}
function placeExterior(){
  const k=crashK(),two=V.cam.lean>0; // iki tekerlekliler yatar, kazada devrilir
  EXT.root.position.set(S.x,S.jumpH+S.airH+Math.sin(S.t*2.2)*(V.cam.bob||0)+S.co.y*0.5,0);
  EXT.root.rotation.set(-k*0.25,-S.lat*0.015,S.lean+k*(two?1.3:0.2));
  if(EXT.tick)EXT.tick();
}
function placeCamera(){
  const c=V.cam,k=crashK();
  const vib=Math.min(1,S.v/300)*0.004*(c.vib==null?1:c.vib)+S.shake*0.03,jit=()=>(Math.random()-.5)*vib;
  let fov;
  if(camMode==='tp'){
    placeExterior();
    const h=EXT.h,back=Math.max(V.hit.back,EXT.tail||0)+4.5,lift=S.jumpH+S.airH; // tail: modelin kutudan arkaya taşan ucu
    camera.position.set(S.x+jit(),Math.max(2.6,h+1.4)+lift*0.6+jit(),back);
    camera.lookAt(S.x,h*0.55+lift*0.5,-16);
    camera.rotation.z+=S.lean*0.2;
    fov=66+Math.min(5,S.v*0.025)+S.co.fov;
  }else{
    let roll=S.lean+S.co.roll+k*(c.lean>0?1.1:0.25);
    const camY=c.y+Math.sin(S.t*2.2)*(c.bob||0)+S.co.y+S.jumpH+S.airH-k*Math.min(0.75,c.y*0.4);
    camera.position.set(S.x+jit(),camY+jit(),0);
    camera.rotation.set(-0.05+jit()*0.5,-S.lat*0.006,roll);
    // Hızla görüş açısı en fazla 5° genişler. Daha fazlası öndeki aracı olduğundan uzak gösterir
    // ve çarpışma "dokunmadan" olmuş gibi hissettirir.
    fov=c.fov+Math.min(5,S.v*0.025)+S.co.fov;
    if(RIG.steer)RIG.steer.rotation[RIG.steerAxis]=-S.lat*RIG.steerK;
  }
  if(Math.abs(camera.fov-fov)>0.05){camera.fov=fov;camera.updateProjectionMatrix();}
  sky.position.set(camera.position.x,0,0);
}

// Trafik: aynı yöndeki araçlar (savrulma / yanma / küçülme efektleri dahil) ve karşı şerit
const TRAFFIC_BASE=16,TRAFFIC_MAX=CAR_COUNT,TRAFFIC_STEP_M=1500; // başta 16 araç, her 1.5 km'de bir fazlası
function updateTraffic(dt,ms,run){
  beginCarFx();
  const target=Math.min(TRAFFIC_MAX,TRAFFIC_BASE+Math.floor(S.dist/TRAFFIC_STEP_M));
  for(let i=0;i<cars.length;i++){
    const c=cars[i];
    if(!c.on){if(i<target&&Math.random()<dt)spawnCar(c,false);continue;}
    c.z+=(ms-c.sp)*dt;
    if(c.tx!=null)c.x+=(c.tx-c.x)*Math.min(1,dt*1.8);
    if(c.fly){ // tank çarptı: havaya savrulur
      const f=c.fly;
      f.t+=dt;f.v[1]-=20*dt;
      c.x+=f.v[0]*dt;c.y+=f.v[1]*dt;c.z+=f.v[2]*dt;
      c.grp.rotation.x+=f.r[0]*dt;c.grp.rotation.y+=f.r[1]*dt;c.grp.rotation.z+=f.r[2]*dt;
      if(f.t>3||c.y<-4){spawnCar(c,false);continue;}
    }
    if(c.burn!=null){ // ejderha yaktı: kararır, alev alır, gömülür
      c.burn+=dt;c.y=-c.burn*0.35;
      if(Math.random()<dt*12)fx(c.x+rnd(-0.8,0.8),c.ht+c.y,c.z+rnd(-1.5,1.5),Math.random()<0.5?0xff7a1a:0xffd040,1,2,2.2,0.6,-3);
      if(c.burn>1.6){smoke(c.x,1,c.z);spawnCar(c,false);continue;}
    }
    if(c.mini&&c.grp.scale.x>0.3)c.grp.scale.setScalar(Math.max(0.3,c.grp.scale.x-dt*2));
    if(c.z>60||c.z<-FOG_FAR-120){
      if(i<target)spawnCar(c,false);else{c.on=false;c.grp.visible=false;}
      continue;
    }
    c.grp.position.set(c.x,c.y,c.z);
    if(!c.fly&&c.burn==null)addCarFx(c); // savrulan / yanan aracın gölgesi ve lambası olmaz
    if(!run||c.fly||c.burn!=null||c.mini||!hitsPlayer(c,c.x,c.z,0))continue;
    if(S.passThru||S.jumpH+S.airH>c.ht-0.3)continue; // hayalet geçişi / zıplama / rampa uçuşu: çarpmaz
    if(c.z+c.hz>0&&c.sp>ms){                  // arkadan gelen (görünmeyen) araç: çarpmaz, fren yapıp arkada kalır
      c.sp=ms*0.9;c.z=V.hit.back+c.hl-c.hz+0.5;
      continue;
    }
    if(V.onHit&&V.onHit(c))continue;          // araca özel (tank ezer)
    crash();
  }
  for(const c of oppCars){
    c.z+=(ms+c.sp)*dt;
    if(c.z>30)spawnOpp(c,false);
    c.grp.position.set(c.x,0,c.z);
    addCarFx(c);
  }
  endCarFx();
}

function update(dt){
  const run=S.state==='run',ph=V.phys;
  S.t+=dt;
  S.co.y=0;S.co.roll=0;S.co.fov=0;S.passThru=false;S.tint='';
  const steer=run?(keys.right?1:0)-(keys.left?1:0):0;
  let a;
  if(run){
    if(keys.gas)a=ph.A/(1+Math.pow(S.v/ph.K,ph.p))+ph.min; // üst sınır yok, hızlandıkça çok yavaş artar
    else a=-(1.5+S.v*0.02)*ph.drag;
    if(keys.brake)a=(keys.gas?a*0.3:a)-ph.brake;
  }else a=-(40+S.v*1.5);
  S.v=Math.max(0,S.v+a*dt);
  if(S.v>S.maxV)S.maxV=S.v;

  const sf=Math.min(1,S.v/25);
  const tgt=steer*(2.2+Math.min(S.v,380)*0.022)*sf*ph.steer;
  S.lat+=(tgt-S.lat)*Math.min(1,dt*(ph.grip||6));
  S.x+=S.lat*dt;
  const lo=xMin(),hi=xMax();
  if(S.x<lo||S.x>hi){
    S.x=Math.max(lo,Math.min(hi,S.x));S.lat=0;
    if(S.v>20){S.v*=1-dt*0.9;S.shake=Math.max(S.shake,0.35);}
  }
  S.lean+=(Math.max(-0.42,Math.min(0.42,-S.lat*V.cam.lean))-S.lean)*Math.min(1,dt*5);

  abilityUpdate(dt);
  if(S.airV!==0||S.airH>0){ // rampadan havalanma: yerçekimiyle iner, sert inişte sarsılır
    S.airV-=22*dt;S.airH=Math.max(0,S.airH+S.airV*dt);
    if(S.airH===0){if(S.airV<-6){S.shake=Math.max(S.shake,0.5);SFX.thud();}S.airV=0;}
  }
  const ms=S.v/3.6,d=ms*dt;
  moveWorld(d);
  seaTex.offset.x=(S.t*0.006)%1; // deniz yüzeyi hafifçe akar
  if(V.update)V.update(dt,d);
  updateTraffic(dt,ms,run);
  updateRoad(dt,d);
  updateSky(dt);
  updateFx(dt,d);
  if(RIG.tick)RIG.tick(dt);
  if(popT>0){popT-=dt;if(popT<=0)popEl.style.opacity=0;}
  if(S.state==='crash'){S.crashT+=dt;if(S.crashT>1.3)gameOver();}
  S.shake=Math.max(0,S.shake-dt*1.5);
}

// ---------- Ses ----------
let AC=null,eng=null,muted=false;
function setOscTypes(){
  const s=V.snd;
  eng.o1.type=s.o1;eng.o2.type=s.o2;eng.g2.gain.value=s.g2;
}
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.Q.value=3;
    const eg=AC.createGain();eg.gain.value=0;lp.connect(eg);eg.connect(master);
    const o1=AC.createOscillator();const g1=AC.createGain();g1.gain.value=0.5;o1.connect(g1);g1.connect(lp);
    const o2=AC.createOscillator();const g2=AC.createGain();g2.gain.value=0.25;o2.connect(g2);g2.connect(lp);
    o1.start();o2.start();
    eng={master,lp,eg,o1,o2,g2};
    sfxOut=AC.createGain();sfxOut.gain.value=0;sfxOut.connect(AC.destination);
    setOscTypes();
  }catch(e){AC=null;eng=null;}
}
// Oyun durunca ses motorunu uyut (osilatörler boşuna çalışıp pil harcamasın).
// Kısa gecikme: sesin sönmesi kesilmeden tamamlansın. startRun() yeniden uyandırır.
function sleepAudio(){
  if(!AC)return;
  setTimeout(()=>{if(S.state!=='run'&&S.state!=='crash'&&AC.state==='running')AC.suspend();},300);
}
function updAudio(){
  if(!eng)return;
  const t=AC.currentTime,on=!muted&&(S.state==='run'||S.state==='crash'),s=V.snd;
  const rpm=gearInfo(S.v).rpm,f=s.base+rpm*s.range;
  eng.master.gain.setTargetAtTime(on?1:0,t,0.08);
  sfxOut.gain.setTargetAtTime(on?1:0,t,0.03);
  eng.eg.gain.setTargetAtTime(s.vol*(keys.gas?1.15:0.85),t,0.08);
  if(f>0){eng.o1.frequency.setTargetAtTime(f,t,0.03);eng.o2.frequency.setTargetAtTime(f*s.mul,t,0.03);}
  eng.lp.frequency.setTargetAtTime(s.lp+rpm*s.lpR+(keys.gas?500:0),t,0.05);
}

function showOv(mode,title,txt){
  ovTitle.textContent=title;ovTxt.innerHTML=txt;
  grid.style.display=mode==='menu'?'':'none';
  ovMain.textContent=mode==='menu'?'BAŞLA':mode==='pause'?'▶ DEVAM':'⟲ TEKRAR';
  ovReset.style.display=mode==='pause'?'':'none';
  ovGarage.style.display=mode==='menu'?'none':'';
  ov.classList.add('show');
}
function showMenu(){
  S.state='menu';bPause.textContent='▶';
  showOv('menu','SAHİL YOLU','Aracını seç ve trafiğe çarpmadan ne kadar uzağa gidebileceğini gör.');
  resetWorld();updAudio();sleepAudio();
}
function startRun(){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  for(const k in keys)keys[k]=false;
  document.querySelectorAll('.pad.on').forEach(e=>e.classList.remove('on'));
  zp.clear();zoneSet();
  S.state='run';ov.classList.remove('show');bPause.textContent='⏸';
  last=performance.now();
}
function pause(){
  if(S.state!=='run')return;
  S.state='pause';bPause.textContent='▶';
  showOv('pause','DURAKLATILDI',V.emoji+' '+V.name+' &nbsp;·&nbsp; Mesafe: <b>'+(S.dist/1000).toFixed(2)+' km</b>');
  updAudio();sleepAudio();dirty=true;
}
function resetGame(){resetWorld();startRun();}
function gameOver(){
  S.state='over';bPause.textContent='▶';
  const km=S.dist/1000;let rec='';
  if(km>S.best){S.best=km;rec='<br><b style="color:#ffd27a">🏆 YENİ REKOR!</b>';store.set('sahilyolu_best_'+V.id,String(km));}
  showOv('over','KAZA!',V.emoji+' '+V.name+' &nbsp;·&nbsp; Mesafe: <b>'+km.toFixed(2)+' km</b> &nbsp;·&nbsp; En yüksek hız: <b>'+Math.round(S.maxV)+' km/h</b>'+rec);
  updAudio();sleepAudio();updHud();dirty=true;
}
ovMain.addEventListener('click',()=>{
  if(S.state==='menu'||S.state==='pause')startRun();
  else if(S.state==='over')resetGame();
});
ovReset.addEventListener('click',resetGame);
ovGarage.addEventListener('click',showMenu);
bPause.addEventListener('click',()=>{
  if(S.state==='run')pause();
  else if(S.state==='pause'||S.state==='menu')startRun();
  else if(S.state==='over')resetGame();
});
$('bReset').addEventListener('click',resetGame);
const bCam=$('bCam');
bCam.addEventListener('click',toggleCam);
const bSound=$('bSound');
bSound.addEventListener('click',()=>{muted=!muted;bSound.textContent=muted?'🔇':'🔊';initAudio();updAudio();sleepAudio();});

const toast=$('toast');let toastT=0;
function showToast(t){toast.textContent=t;toast.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>toast.style.display='none',3500);}
function lockLandscape(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}
function toggleFS(){
  const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){
    (d.exitFullscreen||d.webkitExitFullscreen).call(d);return;
  }
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){showToast('iPhone\'da tam ekran için: Safari → Paylaş → "Ana Ekrana Ekle", sonra oradan aç.');return;}
  try{const p=req.call(el,{navigationUI:'hide'});if(p&&p.then)p.then(lockLandscape).catch(()=>showToast('Tam ekran açılamadı'));else lockLandscape();}catch(e){showToast('Tam ekran açılamadı');}
}
$('bFs').addEventListener('click',toggleFS);
$('ovFs').addEventListener('click',toggleFS);
$('rotFs').addEventListener('click',toggleFS);

function bindPad(id,k){
  const el=$(id);
  const on=e=>{e.preventDefault();keys[k]=true;el.classList.add('on');};
  const off=e=>{e.preventDefault();keys[k]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
}
bindPad('gas','gas');bindPad('brake','brake');bindPad('abil','ab');

// Sol-sağ yön alanı: tek geniş bölge, parmağı kaldırmadan kaydırarak yön değiştirilebilir
const zone=$('ctlL'),zl=$('pLeft'),zr=$('pRight'),zp=new Map();
function zoneSet(){
  let l=false,r=false;zp.forEach(v=>{if(v<0)l=true;else r=true;});
  keys.left=l;keys.right=r;zl.classList.toggle('on',l);zr.classList.toggle('on',r);
}
function zoneSide(e){const b=zone.getBoundingClientRect();return e.clientX<b.left+b.width/2?-1:1;}
zone.addEventListener('pointerdown',e=>{e.preventDefault();try{zone.setPointerCapture(e.pointerId);}catch(_){}zp.set(e.pointerId,zoneSide(e));zoneSet();});
zone.addEventListener('pointermove',e=>{if(zp.has(e.pointerId)){zp.set(e.pointerId,zoneSide(e));zoneSet();}});
const zoneUp=e=>{if(zp.delete(e.pointerId))zoneSet();};
zone.addEventListener('pointerup',zoneUp);zone.addEventListener('pointercancel',zoneUp);zone.addEventListener('lostpointercapture',zoneUp);
zone.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
zone.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.card'))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

const KM={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyE:'ab',ShiftLeft:'ab',ShiftRight:'ab'};
window.addEventListener('keydown',e=>{
  if(KM[e.code]){keys[KM[e.code]]=true;e.preventDefault();}
  else if(e.code==='KeyP'||e.code==='Escape'){if(S.state==='run')pause();else if(S.state==='pause')startRun();}
  else if(e.code==='KeyR'&&S.state!=='menu')resetGame();
  else if(e.code==='KeyC')toggleCam();
  else if(e.code==='Enter'&&S.state!=='run'&&S.state!=='crash')ovMain.click();
});
window.addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pause();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pause();sleepAudio();}
  else if(AC&&!muted&&S.state==='run')AC.resume();
});

const rot=$('rot');
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  const portrait=isTouch&&h>w;
  rot.classList.toggle('show',portrait);
  if(portrait)pause();
  dirty=true;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,250));

// ---------- Döngü ----------
// Kare süresi ölçümü: 2 sn'lik pencerelerde ortalama alınır. Yavaşsa çözünürlük düşer (alt sınır 1;
// daha düşükte uzaktaki araçlar seçilemiyor), art arda 3 pencere hızlıysa yeniden yükselir.
let last=performance.now(),hudT=0,audioT=0,perfT=0,perfN=0,fastWindows=0;
function adaptResolution(raw){
  if(raw>0.25)return; // arka plandan dönüş gibi tek seferlik uzun kareler ölçümü bozmasın
  perfT+=raw;perfN++;
  if(perfT<2)return;
  const avg=perfT/perfN;perfT=0;perfN=0;
  if(avg>1/40&&pr>1){pr=Math.max(1,pr-0.25);fastWindows=0;}
  else if(avg<1/55&&pr<maxPR){if(++fastWindows<3)return;pr=Math.min(maxPR,pr+0.25);fastWindows=0;}
  else{fastWindows=0;return;}
  renderer.setPixelRatio(pr);resize();
}
function loop(now){
  requestAnimationFrame(loop);
  const raw=(now-last)/1000;last=now;
  if(raw<=0)return;
  const dt=Math.min(raw,0.05);
  if(S.state==='run'||S.state==='crash'){
    // Bir adımda en fazla ~3 m ilerlensin: çok yüksek hızda araçların içinden geçip çarpışma kaçmaz
    const steps=Math.min(8,Math.max(dt>0.025?2:1,Math.ceil(S.v/3.6*dt/3)));
    for(let i=0;i<steps&&(S.state==='run'||S.state==='crash');i++)update(dt/steps);
    presentFrame(dt);
    hudT+=dt;if(hudT>0.1){hudT=0;updHud();}
    audioT+=dt;if(audioT>0.05){audioT=0;updAudio();} // ses parametreleri saniyede 20 kez yeter
    renderer.render(scene,camera);
    adaptResolution(raw);
  }else if(dirty){
    dirty=false;
    renderer.render(scene,camera);
  }
}
// Açılışta tüm araç gövdelerini ve gökyüzü olaylarının malzeme türlerini görüş alanı dışında bir kez çiz:
// geometriler ekran kartına yüklenir, gölgelendiriciler derlenir; oyunda ilk göründüklerinde takılma olmaz.
// (Malzemeler bilerek serbest bırakılmaz; bırakılırsa derlenmiş program da silinir.)
function warmup(){
  const g=new THREE.Group();g.position.y=-500;
  const add=o=>{o.frustumCulled=false;g.add(o);};
  for(const k in carCache){add(new THREE.Mesh(carCache[k].b,carMat));add(new THREE.Mesh(carCache[k].l,carLightMat));}
  add(new THREE.Mesh(BOX,burntMat));
  for(const m of [E.lam(0xffffff),E.lam(0xffffff,{side:THREE.DoubleSide}),E.phong(0xffffff),E.basic(0xffffff),
    E.basic(0xffffff,{transparent:true,opacity:0.5}),E.basic(0xffffff,{additive:true,opacity:0.5,side:THREE.DoubleSide})])add(new THREE.Mesh(BOX,m));
  add(E.glow(0xffffff,1));
  scene.add(g);
  renderer.compile(scene,camera);renderer.render(scene,camera);
  scene.remove(g);
}
resize();
applyVehicle(store.get('sahilyolu_vehicle')||VEHICLES[0].id);
warmup();
requestAnimationFrame(loop);
})();
</script>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oyun Odası</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #12141a;
      color: #e8eaf0;
    }
    .kart {
      width: 100%;
      max-width: 380px;
      background: #1c1f28;
      border: 1px solid #2c303c;
      border-radius: 14px;
      padding: 28px;
    }
    h1 { margin: 0 0 20px; font-size: 22px; }
    .sekmeler { display: flex; gap: 8px; margin-bottom: 20px; }
    .sekme {
      flex: 1;
      padding: 10px;
      border: 1px solid #2c303c;
      border-radius: 8px;
      background: transparent;
      color: #9aa1b2;
      font-size: 15px;
      cursor: pointer;
    }
    .sekme.aktif { background: #2a2f3d; color: #fff; border-color: #4a5168; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #9aa1b2; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #2c303c;
      border-radius: 8px;
      background: #12141a;
      color: #fff;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #5b8cff; outline-offset: -1px; }
    .ana-dugme {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #5b8cff;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .ana-dugme:disabled { opacity: .6; cursor: default; }
    .ikincil-dugme {
      padding: 8px 14px;
      border: 1px solid #2c303c;
      border-radius: 8px;
      background: transparent;
      color: #e8eaf0;
      font-size: 14px;
      cursor: pointer;
    }
    .hata { min-height: 20px; margin-top: 14px; font-size: 14px; color: #ff7b7b; }
    .ipucu { margin-top: 6px; font-size: 12px; color: #6f7687; }
    .ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .ust h1 { margin: 0; }
    .baslik-kucuk { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6f7687; text-align: center; margin-bottom: 10px; }
    .oyun-dugme {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
      padding: 18px 16px;
      border: 1px solid #3a4052;
      border-radius: 12px;
      background: #262b38;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .oyun-dugme:hover { border-color: #5b8cff; }
    .oyun-dugme:disabled { opacity: .6; cursor: default; }
    .oyun-dugme small { font-size: 13px; font-weight: 500; color: #9aa1b2; white-space: nowrap; }
    #oyun-alani {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      background: #f6dcc2;
      overscroll-behavior: none;
    }
    .gizli, #oyun-alani.gizli { display: none; }
  </style>
</head>
<body>
  <div class="kart">

    <div id="ekran-yukleniyor">Yükleniyor...</div>

    <!-- Giriş / Kayıt -->
    <div id="ekran-giris" class="gizli">
      <h1>Oyun Odası</h1>
      <div class="sekmeler">
        <button type="button" class="sekme aktif" id="sekme-giris">Giriş yap</button>
        <button type="button" class="sekme" id="sekme-kayit">Kayıt ol</button>
      </div>
      <form id="form-giris">
        <label for="kullanici">Kullanıcı adı</label>
        <input id="kullanici" autocomplete="username" required>
        <div class="ipucu gizli" id="ipucu-kullanici">3-20 karakter; yalnızca harf, rakam ve alt çizgi.</div>

        <label for="sifre">Şifre</label>
        <input id="sifre" type="password" autocomplete="current-password" required>
        <div class="ipucu gizli" id="ipucu-sifre">En az 6 karakter.</div>

        <div id="alan-kod" class="gizli">
          <label for="kod">Davet kodu</label>
          <input id="kod" autocomplete="off">
        </div>

        <button class="ana-dugme" id="dugme-gonder">Giriş yap</button>
        <div class="hata" id="hata-giris"></div>
      </form>
    </div>

    <!-- Hesabı var ama üyeliği tamamlanmamış -->
    <div id="ekran-kod" class="gizli">
      <h1>Davet kodu gerekli</h1>
      <p>Hesabın açıldı ama üyeliğin tamamlanmadı. Davet kodunu yaz.</p>
      <form id="form-kod">
        <label for="kod2">Davet kodu</label>
        <input id="kod2" autocomplete="off" required>
        <button class="ana-dugme">Devam et</button>
        <div class="hata" id="hata-kod"></div>
      </form>
      <p><button type="button" class="ikincil-dugme" id="cikis2">Çıkış</button></p>
    </div>

    <!-- Giriş yapmış üye -->
    <div id="ekran-ana" class="gizli">
      <div class="ust">
        <h1>Merhaba, <span id="ben-ad"></span></h1>
        <button type="button" class="ikincil-dugme" id="cikis">Çıkış</button>
      </div>
      <div class="baslik-kucuk">Oyunlar</div>
      <button type="button" class="oyun-dugme" id="oyun-sosis">
        <span>The Sosis Game</span>
        <small id="sosis-bolum"></small>
      </button>
      <div class="hata" id="hata-ana"></div>
    </div>

  </div>

  <div id="oyun-alani" class="gizli"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, signOut, deleteUser
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getDatabase, ref, get, set, runTransaction, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDOsCFHNwEpFBk_CNw-mf1kwxjNRPUDgK8",
      authDomain: "website-47054.firebaseapp.com",
      databaseURL: "https://website-47054-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "website-47054",
      storageBucket: "website-47054.firebasestorage.app",
      messagingSenderId: "366207205746",
      appId: "1:366207205746:web:72cdd942f88963ac1c5deb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Firebase Auth e-posta ister; kullanıcı adı bu sonekle e-postaya çevrilir (gerçek bir posta kutusu değildir).
    const EPOSTA_SONEKI = "@website-47054.firebaseapp.com";
    const epostaYap = (ad) => ad.toLowerCase() + EPOSTA_SONEKI;

    const $ = (id) => document.getElementById(id);
    const EKRANLAR = ["yukleniyor", "giris", "kod", "ana"];
    function goster(ad) {
      for (const e of EKRANLAR) $("ekran-" + e).classList.toggle("gizli", e !== ad);
    }

    let mod = "giris";          // "giris" | "kayit"
    let kayitSuruyor = false;   // kayıt adımları bitmeden oturum değişikliği işlenmez
    let ekranSirasi = 0;        // eski bir ekraniGuncelle sonucunun yenisini ezmemesi için
    let sosisSeviye = 1;
    let oyun = null;

    /* ---------- İlerleme ---------- */
    // Gelinen bölüm ilerleme/<uid>/sosis altında tutulur ve bu tarayıcıda yedeklenir.
    // Sunucudaki değer yalnızca ileri gider (başka cihazdaki ilerleme ezilmez); sıfırlama hariç.
    const yerelAnahtar = (uid) => "sosis-" + uid;
    const ilerlemeRef = (uid) => ref(db, "ilerleme/" + uid + "/sosis");
    const KAYIT_UYARI = "İlerleme sunucuya kaydedilemedi; şimdilik yalnızca bu cihazda duruyor.";
    let kayitHatasi = false;

    function seviyeGoster(uid, seviye) {
      sosisSeviye = seviye;
      localStorage.setItem(yerelAnahtar(uid), String(seviye));
      $("sosis-bolum").textContent = "Bölüm " + seviye;
    }
    function kayitDurumu(hata, e) {
      kayitHatasi = hata;
      if (e) console.warn("İlerleme kaydedilemedi:", e);
    }
    async function ilerlemeIlerlet(uid, seviye) {
      const sonuc = await runTransaction(ilerlemeRef(uid), (mevcut) => Math.max(Number(mevcut) || 1, seviye));
      return Number(sonuc.snapshot.val()) || seviye;
    }
    async function ilerlemeOku(uid) {
      const yerel = Number(localStorage.getItem(yerelAnahtar(uid))) || 1;
      try {
        const seviye = await ilerlemeIlerlet(uid, yerel);
        kayitDurumu(false);
        return seviye;
      } catch (e) {
        kayitDurumu(true, e);
        return yerel;
      }
    }
    function ilerlemeYaz(uid, seviye, sifirla) {
      seviyeGoster(uid, seviye);
      const is = sifirla ? set(ilerlemeRef(uid), seviye).then(() => seviye) : ilerlemeIlerlet(uid, seviye);
      is.then((sunucu) => {
        kayitDurumu(false);
        if (sunucu > sosisSeviye) seviyeGoster(uid, sunucu);
      }).catch((e) => kayitDurumu(true, e));
    }

    /* ---------- Son giriş ---------- */
    // Her kullanıcının yalnızca en son giriş zamanı tutulur: sonGiris/<uid> = { ad, zaman, metin }.
    // zaman sunucu saatidir (ms); metin aynı anın Türkiye saatiyle okunur hâlidir.
    // Oturumu açık kalan kullanıcının siteyi yeniden açması da giriş sayılır (sayfa başına bir kez).
    const saatBicimi = new Intl.DateTimeFormat("tr-TR", {
      timeZone: "Europe/Istanbul", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
    });
    let sonGirisYazilan = null;
    function sonGirisKaydet(uid, ad) {
      if (sonGirisYazilan === uid) return;
      sonGirisYazilan = uid;
      set(ref(db, "sonGiris/" + uid), { ad, zaman: serverTimestamp(), metin: saatBicimi.format(new Date()) })
        .catch((e) => { sonGirisYazilan = null; console.warn("Son giriş kaydedilemedi:", e); });
    }

    /* ---------- Oyunu aç / kapat ---------- */
    const dokunmatik = window.matchMedia("(pointer: coarse)").matches;
    // Telefonda oyun tam ekran ve yatay açılır; desteklenmiyorsa oyun "telefonu çevir" uyarısı gösterir.
    async function yatayTamEkran(el) {
      if (!dokunmatik) return;
      try {
        await el.requestFullscreen?.({ navigationUI: "hide" });
        await screen.orientation?.lock?.("landscape");
      } catch { /* desteklenmiyor */ }
    }
    function normalEkran() {
      try { screen.orientation?.unlock?.(); } catch { /* desteklenmiyor */ }
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }
    const anaHataGoster = () => { $("hata-ana").textContent = kayitHatasi ? KAYIT_UYARI : ""; };

    function oyunuKapat() {
      oyun?.destroy();
      oyun = null;
      $("oyun-alani").classList.add("gizli");
      document.querySelector(".kart").classList.remove("gizli");
      normalEkran();
      anaHataGoster();
    }
    // Her oyun kendi klasöründedir: game/<oyun>/<oyun>.js
    async function sosisAc() {
      const user = auth.currentUser;
      if (!user || oyun) return;
      const dugme = $("oyun-sosis"), alan = $("oyun-alani");
      $("hata-ana").textContent = "";
      dugme.disabled = true;
      document.querySelector(".kart").classList.add("gizli");
      alan.classList.remove("gizli");
      yatayTamEkran(alan);
      try {
        const { startSosis } = await import("./sosis/sosis.js");
        oyun = startSosis({
          mount: alan,
          unlocked: sosisSeviye,
          level: sosisSeviye - 1,
          onProgress: (seviye, sifirla) => ilerlemeYaz(user.uid, seviye, sifirla),
          onExit: oyunuKapat
        });
      } catch (e) {
        console.error(e);
        oyunuKapat();
        $("hata-ana").textContent = "Oyun yüklenemedi. İnternetini kontrol edip tekrar dene.";
      } finally {
        dugme.disabled = false;
      }
    }

    function modDegistir(yeni) {
      mod = yeni;
      const kayit = mod === "kayit";
      $("sekme-giris").classList.toggle("aktif", !kayit);
      $("sekme-kayit").classList.toggle("aktif", kayit);
      $("alan-kod").classList.toggle("gizli", !kayit);
      $("ipucu-kullanici").classList.toggle("gizli", !kayit);
      $("ipucu-sifre").classList.toggle("gizli", !kayit);
      $("sifre").autocomplete = kayit ? "new-password" : "current-password";
      $("dugme-gonder").textContent = kayit ? "Kayıt ol" : "Giriş yap";
      $("hata-giris").textContent = "";
    }
    $("sekme-giris").onclick = () => modDegistir("giris");
    $("sekme-kayit").onclick = () => modDegistir("kayit");

    class KullaniciHatasi extends Error {}
    const izinYok = (e) => /permission[_ ]denied/i.test(`${e?.code} ${e?.message}`);

    function hataMesaji(e) {
      if (e instanceof KullaniciHatasi) return e.message;
      switch (e?.code) {
        case "auth/email-already-in-use": return "Bu kullanıcı adı alınmış.";
        case "auth/weak-password": return "Şifre en az 6 karakter olmalı.";
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found": return "Kullanıcı adı ya da şifre yanlış.";
        case "auth/too-many-requests": return "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.";
        case "auth/network-request-failed": return "Bağlantı kurulamadı. İnternetini kontrol et.";
        case "auth/operation-not-allowed": return "Firebase'de Email/Password girişi açık değil.";
        case "auth/admin-restricted-operation": return "Firebase'de yeni kayıt kapalı.";
        default: return "Bir hata oluştu: " + (e?.code || e?.message || "bilinmiyor");
      }
    }

    // Davet kodunu veritabanı kurallarına doğrulatır, sonra kullanıcı adını kaydeder.
    async function uyeOl(user, kod, ad) {
      try {
        await set(ref(db, "uyeler/" + user.uid), kod);
      } catch (e) {
        throw izinYok(e) ? new KullaniciHatasi("Davet kodu yanlış.") : e;
      }
      await set(ref(db, "kullanicilar/" + user.uid), { ad });
    }

    async function ekraniGuncelle(user) {
      const sira = ++ekranSirasi;
      if (!user) { sonGirisYazilan = null; oyunuKapat(); goster("giris"); return; }
      try {
        const uye = await get(ref(db, "uyeler/" + user.uid));
        if (sira !== ekranSirasi) return;
        if (!uye.exists()) { goster("kod"); return; }

        const adRef = ref(db, "kullanicilar/" + user.uid);
        const kayit = await get(adRef);
        let ad = kayit.val()?.ad;
        if (!ad) {
          ad = user.email.split("@")[0];
          await set(adRef, { ad });
        }
        const seviye = await ilerlemeOku(user.uid);
        if (sira !== ekranSirasi) return;
        $("ben-ad").textContent = ad;
        sonGirisKaydet(user.uid, ad);
        seviyeGoster(user.uid, seviye);
        anaHataGoster();
        goster("ana");
      } catch (e) {
        if (sira !== ekranSirasi) return;
        console.error(e);
        goster("giris");
        $("hata-giris").textContent = hataMesaji(e);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (!kayitSuruyor) ekraniGuncelle(user);
    });

    $("form-giris").addEventListener("submit", async (olay) => {
      olay.preventDefault();
      const ad = $("kullanici").value.trim();
      const sifre = $("sifre").value;
      const kod = $("kod").value.trim();
      const hata = $("hata-giris");
      const dugme = $("dugme-gonder");
      hata.textContent = "";

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(ad)) {
        hata.textContent = "Kullanıcı adı 3-20 karakter olmalı; yalnızca harf, rakam ve alt çizgi.";
        return;
      }
      if (mod === "kayit" && sifre.length < 6) { hata.textContent = "Şifre en az 6 karakter olmalı."; return; }
      if (mod === "kayit" && !kod) { hata.textContent = "Davet kodunu yaz."; return; }

      dugme.disabled = true;
      try {
        if (mod === "giris") {
          await signInWithEmailAndPassword(auth, epostaYap(ad), sifre);
        } else {
          kayitSuruyor = true;
          try {
            const sonuc = await createUserWithEmailAndPassword(auth, epostaYap(ad), sifre);
            try {
              await uyeOl(sonuc.user, kod, ad);
            } catch (e) {
              // Üyelik tamamlanmazsa hesap silinir; kullanıcı adı yeniden alınabilir.
              await deleteUser(sonuc.user).catch(() => {});
              throw e;
            }
          } finally {
            kayitSuruyor = false;
          }
          await ekraniGuncelle(auth.currentUser);
        }
      } catch (e) {
        if (auth.currentUser) await ekraniGuncelle(auth.currentUser);
        hata.textContent = hataMesaji(e);
      } finally {
        dugme.disabled = false;
      }
    });

    $("form-kod").addEventListener("submit", async (olay) => {
      olay.preventDefault();
      const user = auth.currentUser;
      const hata = $("hata-kod");
      hata.textContent = "";
      if (!user) { goster("giris"); return; }
      try {
        await uyeOl(user, $("kod2").value.trim(), user.email.split("@")[0]);
        await ekraniGuncelle(user);
      } catch (e) {
        hata.textContent = hataMesaji(e);
      }
    });

    $("oyun-sosis").onclick = sosisAc;
    $("cikis").onclick = () => signOut(auth);
    $("cikis2").onclick = () => signOut(auth);
  </script>
</body>
</html>

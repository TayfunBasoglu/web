<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Sahil Yolu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 48%,rgba(10,6,20,.6) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
button{font-family:inherit;color:#fff;cursor:pointer;outline:none}

#hud{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#spd{display:flex;align-items:baseline;gap:6px}
#spdN{font-size:clamp(28px,9vh,52px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#spd span{font-size:14px;font-weight:700;opacity:.85}
#info{font-size:13px;font-weight:600;opacity:.9;margin-top:4px}
#info b{font-variant-numeric:tabular-nums}

#topbar{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px}
#topbar button{width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(15,15,25,.45);font-size:20px;display:flex;align-items:center;justify-content:center}
#topbar button:active{background:rgba(255,255,255,.3)}

.pad{border:2px solid rgba(255,255,255,.4);background:rgba(15,18,28,.35);font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;letter-spacing:1px;transition:transform .05s}
.pad.on{background:rgba(255,255,255,.35);transform:scale(.95)}
#ctlL{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:14px}
#ctlL .pad{width:clamp(72px,24vh,124px);height:clamp(72px,24vh,124px);border-radius:50%;font-size:clamp(22px,7vh,38px)}
#ctlR{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end}
#brake{width:clamp(72px,23vh,120px);height:clamp(72px,23vh,120px);border-radius:22px;background:rgba(170,25,35,.38);font-size:clamp(14px,4.2vh,22px)}
#gas{width:clamp(84px,25vh,130px);height:clamp(120px,44vh,220px);border-radius:24px;background:rgba(25,150,70,.38);font-size:clamp(16px,5vh,26px)}
#brake.on{background:rgba(255,60,70,.6)}
#colB{display:flex;flex-direction:column;gap:12px;align-items:center}
#abil{display:none;width:clamp(72px,23vh,120px);height:clamp(46px,14vh,78px);border-radius:18px;font-size:clamp(12px,3.8vh,19px);background:rgba(120,60,200,.45)}
#abil.show{display:flex}
#abil.on{background:rgba(200,130,255,.9)!important;box-shadow:0 0 18px rgba(200,130,255,.8)}
#pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(255,255,255,.93);color:#222;padding:8px 16px;border-radius:16px;font-weight:800;font-size:clamp(13px,4vh,19px);opacity:0;transition:opacity .3s;pointer-events:none;max-width:80%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#vig.boost{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 40%,rgba(60,140,255,.55) 100%)}
#vig.ghost{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(110,255,210,.5) 100%)}
#gas.on{background:rgba(60,230,110,.6)}

.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,8,24,.55);padding:12px}
.ov.show{display:flex}
.card{background:rgba(20,16,36,.86);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:18px 22px;text-align:center;max-width:900px;width:100%;max-height:100%;overflow-y:auto;touch-action:pan-y}
.card h1{font-size:clamp(24px,7vh,40px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ffd1b0,#ff9ec4,#a9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin-top:6px;font-size:15px;line-height:1.45;opacity:.92}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.big{border:none;border-radius:14px;padding:12px 22px;font-size:17px;font-weight:800;background:linear-gradient(135deg,#ff7a59,#ff4f8b);box-shadow:0 4px 14px rgba(255,80,120,.35)}
.big.alt{background:rgba(255,255,255,.14);box-shadow:none;border:1px solid rgba(255,255,255,.3)}
.big:active{transform:scale(.97)}
.hint{font-size:12.5px !important;opacity:.7 !important;margin-top:12px !important}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.veh{border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.veh .e{font-size:30px;line-height:1.1}
.veh .n{font-size:13px;font-weight:800}
.veh .d{font-size:10.5px;opacity:.7}
.veh.sel{border-color:#ff6fa8;background:rgba(255,90,150,.22);box-shadow:0 0 14px rgba(255,90,150,.35)}
@media (max-height:430px){
  .card{padding:10px 14px}
  .card p{font-size:13px;margin-top:2px}
  .veh{padding:5px 3px}.veh .e{font-size:24px}.veh .d{display:none}
  #grid{gap:6px;margin-top:8px}.card .row{margin-top:8px}
  .big{padding:9px 18px;font-size:15px}
  .hint{display:none}
}
#rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#120c20;text-align:center;padding:24px;font-size:18px;font-weight:700}
#rot.show{display:flex}
#rot .ic{font-size:64px;animation:rr 1.8s ease-in-out infinite}
@keyframes rr{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:10px 16px;border-radius:12px;font-size:14px;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>
<div id="flash"></div>

<div id="hud">
  <div id="spd"><b id="spdN">0</b><span>km/h</span></div>
  <div id="info">Mesafe <b id="distN">0.00</b> km &nbsp;·&nbsp; Rekor <b id="bestN">0.00</b> km</div>
</div>

<div id="topbar">
  <button id="bPause" title="Durdur / Başlat">▶</button>
  <button id="bReset" title="Sıfırla">⟲</button>
  <button id="bSound" title="Ses">🔊</button>
  <button id="bFs" title="Tam ekran">⛶</button>
</div>

<div id="ctlL">
  <button class="pad" id="pLeft">◀</button>
  <button class="pad" id="pRight">▶</button>
</div>
<div id="ctlR">
  <div id="colB"><button class="pad" id="abil"></button><button class="pad" id="brake">FREN</button></div>
  <button class="pad" id="gas">GAZ</button>
</div>
<div id="pop"></div>

<div id="ov" class="ov show">
  <div class="card">
    <h1 id="ovTitle">SAHİL YOLU</h1>
    <p id="ovTxt">Aracını seç ve trafiğe çarpmadan ne kadar uzağa gidebileceğini gör.</p>
    <div id="grid"></div>
    <div class="row">
      <button id="ovMain" class="big">BAŞLA</button>
      <button id="ovReset" class="big alt" style="display:none">⟲ SIFIRLA</button>
      <button id="ovGarage" class="big alt" style="display:none">🚘 ARAÇ DEĞİŞTİR</button>
      <button id="ovFs" class="big alt">⛶ TAM EKRAN</button>
    </div>
    <p class="hint">Sağ alt: GAZ / FREN &nbsp;·&nbsp; Sol alt: ◀ ▶ şerit değiştir<br>Klavye: ↑ gaz · ↓ / boşluk fren · ← → yön · P durdur · R sıfırla</p>
  </div>
</div>

<div id="rot"><div class="ic">📱</div><div>Telefonu yan çevir</div><button class="big alt" id="rotFs">⛶ TAM EKRAN</button></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   ARAÇ LİSTESİ — YENİ ARAÇ EKLEMEK İÇİN BU LİSTEYE BİR NESNE EKLE
   ---------------------------------------------------------------------
   id      : benzersiz kısa ad (rekor bu adla saklanır)
   name    : menüde görünen ad,  emoji : menü simgesi,  desc : kısa açıklama
   phys    : hızlanma = A / (1 + (hız/K)^p) + min   (km/h/s, üst sınır yok)
             brake: fren gücü, drag: gaz bırakınca yavaşlama, steer: yan kayma hızı çarpanı
   cam     : y: göz yüksekliği (m), fov: görüş açısı, lean: virajda yatma, bob: süzülme, vib: titreşim
   hit     : w: yarı genişlik, front/back: kameradan öne/arkaya uzunluk (çarpışma kutusu)
   gears   : vites geçiş hızları (null = vitessiz, o zaman gearLabel gösterilir, rpmRef ile devir)
   snd     : motor sesi. o1/o2 dalga tipi, mul: 2. osilatör oranı, base+range*devir = frekans (Hz)
             lp/lpR: filtre, vol: motor sesi (0 = sessiz)
   dash    : gösterge renkleri. style: 'digital' veya 'analog'
   build   : kokpit modelini kurar (kamera koordinatında: -z ileri, -y aşağı). K yardımcılarını kullan.
             { root, steer, steerAxis, steerK } döndürür (steer = direksiyon/gidon nesnesi)
   ===================================================================== */
const VEHICLES=[
  {id:'sport',name:'Spor Motor',emoji:'🏍️',desc:'Hızlı ve çevik',
   phys:{A:55,K:110,p:1.8,min:0.8,brake:95,drag:1,steer:1},
   cam:{y:1.25,fov:68,lean:0.042,bob:0,vib:1},hit:{w:0.38,front:1.2,back:0.8},
   gears:[55,95,135,175,225],
   snd:{o1:'sawtooth',o2:'square',mul:0.5,g2:0.25,base:36,range:150,lp:450,lpR:1300,vol:0.2},
   dash:{style:'digital',bg:'#04060a',frame:'#26303c',num:'#ffffff',unit:'#9fb3c4',bars:['#4fe3ff','#ffb020','#ff3344'],gearBg:'#0d2617',gearFg:'#57ff8a'},
   build:()=>sportBike({body:0x141518,dark:0x16171b,yoke:0x2a2b31,fork:0xc9a04e,accent:0x3fb54a,grip:0x0e0e10,barEnd:0xb4b4bc,house:0x0b0b0e,glass:0x2e3448})},

  {id:'car',name:'Araba',emoji:'🚗',desc:'Rahat ve dengeli',
   phys:{A:42,K:120,p:1.8,min:0.6,brake:85,drag:1,steer:0.85},
   cam:{y:1.15,fov:66,lean:0,bob:0,vib:0.5},hit:{w:0.93,front:2.0,back:2.5},
   gears:[50,90,130,170,215],
   snd:{o1:'sawtooth',o2:'square',mul:0.5,g2:0.35,base:30,range:110,lp:350,lpR:800,vol:0.14},
   dash:{style:'digital',bg:'#0a0d14',frame:'#333a48',num:'#e8f1ff',unit:'#8aa0b8',bars:['#5aa9ff','#ffd04a','#ff5050'],gearBg:'#11182a',gearFg:'#7fb8ff'},
   build:()=>carCockpit(0xb3122a)},

  {id:'barbie',name:'Barbie Motor',emoji:'💖',desc:'Pembe ve parıltılı',
   phys:{A:52,K:105,p:1.8,min:0.8,brake:95,drag:1,steer:1},
   cam:{y:1.25,fov:68,lean:0.045,bob:0,vib:0.8},hit:{w:0.38,front:1.2,back:0.8},
   gears:[55,95,135,175,225],
   snd:{o1:'sawtooth',o2:'triangle',mul:2,g2:0.3,base:60,range:200,lp:700,lpR:1800,vol:0.15},
   dash:{style:'digital',bg:'#2a0a1c',frame:'#ff7ac0',num:'#ffffff',unit:'#ffb3da',bars:['#ff9fd5','#ff4fa3','#ff1f7a'],gearBg:'#ff4fa3',gearFg:'#ffffff'},
   build:()=>sportBike({body:0xff4fa3,dark:0xe23d8e,yoke:0xffffff,fork:0xffd700,accent:0xffffff,grip:0xffffff,barEnd:0xffd700,house:0xffffff,glass:0xff9fd0,extra:barbieExtras})},

  {id:'bike',name:'Bisiklet',emoji:'🚲',desc:'Yavaş ama sakin',
   phys:{A:14,K:22,p:2,min:0.15,brake:60,drag:0.6,steer:0.8},
   cam:{y:1.55,fov:66,lean:0.03,bob:0,vib:0.6},hit:{w:0.33,front:1.0,back:0.8},
   gears:null,gearLabel:'🚲',rpmRef:40,
   snd:{o1:'sine',o2:'sine',mul:1,g2:0,base:0,range:0,lp:200,lpR:0,vol:0},
   dash:{style:'digital',bg:'#a9b49a',frame:'#4d5644',num:'#1d2418',unit:'#3a4532',bars:['#2d3626','#2d3626','#2d3626'],gearBg:'#97a289',gearFg:'#1d2418'},
   build:bicycleCockpit},

  {id:'scooter',name:'E-Scooter',emoji:'🛴',desc:'Elektrikli, sessiz',
   phys:{A:24,K:32,p:2,min:0.25,brake:70,drag:0.8,steer:0.9},
   cam:{y:1.65,fov:66,lean:0.025,bob:0,vib:0.7},hit:{w:0.3,front:0.8,back:0.5},
   gears:null,gearLabel:'⚡',rpmRef:60,
   snd:{o1:'sine',o2:'triangle',mul:2.01,g2:0.3,base:140,range:520,lp:2500,lpR:2500,vol:0.06},
   dash:{style:'digital',bg:'#05080a',frame:'#14c8b0',num:'#ffffff',unit:'#7de8d8',bars:['#14c8b0','#14c8b0','#ffcc33'],gearBg:'#06322c',gearFg:'#14f0d0'},
   build:scooterCockpit},

  {id:'space',name:'Uzay Motoru',emoji:'🚀',desc:'Süzülen, çok hızlı',
   phys:{A:80,K:180,p:1.6,min:2,brake:110,drag:0.8,steer:1.15},
   cam:{y:1.4,fov:70,lean:0.06,bob:0.035,vib:0.4},hit:{w:0.6,front:1.4,back:0.8},
   gears:null,gearLabel:'W',rpmRef:250,
   snd:{o1:'sawtooth',o2:'sine',mul:1.5,g2:0.6,base:70,range:260,lp:500,lpR:2500,vol:0.12},
   dash:{style:'digital',holo:true,bg:'#000000',frame:'#2ff3ff',num:'#9ffcff',unit:'#ff6ef5',bars:['#2ff3ff','#b36bff','#ff4ff0'],gearBg:'#081a24',gearFg:'#ff6ef5'},
   build:spaceCockpit},

  {id:'chopper',name:'Motorcu',emoji:'🤘',desc:'Klasik chopper',
   phys:{A:40,K:100,p:1.9,min:0.6,brake:85,drag:1,steer:0.9},
   cam:{y:1.2,fov:68,lean:0.035,bob:0,vib:1.4},hit:{w:0.45,front:1.5,back:0.9},
   gears:[50,90,130,170],dialMax:240,
   snd:{o1:'square',o2:'sawtooth',mul:0.5,g2:0.5,base:24,range:90,lp:300,lpR:900,vol:0.22},
   dash:{style:'analog',bg:'#1a1a1c',rim:'#d8d8de',face:'#f1e6cc',tick:'#222222',needle:'#c41e1e',num:'#222222'},
   build:chopperCockpit},

  {id:'truck',name:'Tır',emoji:'🚛',desc:'Ağır ve güçlü',
   phys:{A:20,K:80,p:1.8,min:0.35,brake:55,drag:1.2,steer:0.6},
   cam:{y:2.55,fov:64,lean:0,bob:0,vib:0.5},hit:{w:1.25,front:1.5,back:14},
   gears:[20,35,50,65,80,95,110,130],
   snd:{o1:'square',o2:'sawtooth',mul:0.5,g2:0.6,base:22,range:55,lp:220,lpR:600,vol:0.22},
   dash:{style:'digital',bg:'#0c0a04',frame:'#5a4a20',num:'#ffb000',unit:'#c08a20',bars:['#ffb000','#ff8000','#ff3300'],gearBg:'#2a1e04',gearFg:'#ffb000'},
   build:truckCockpit},

  /* ----- Özel yetenekli araçlar -----
     ability : sağ alttaki mor butonun işi. label: yazı, mode: 'tap' (bas), 'hold' (basılı tut, enerji harcar), 'toggle' (aç/kapa)
               cd: bekleme süresi, dur: etki süresi, start/update/end: ne yapacağı
     reset/update(dt,d): araca özel her kare çalışan kurallar,  onHit(araç): çarpınca kaza yerine ne olacağı (true = kaza yok)
     dashInfo: göstergenin sol altında km yerine yazılacak bilgi */
  {id:'f1',name:'Formula 1',emoji:'🏎️',desc:'NİTRO ile fırla',
   phys:{A:70,K:160,p:1.7,min:1.2,brake:130,drag:1.2,steer:1.15,grip:8},
   cam:{y:0.8,fov:70,lean:0,bob:0,vib:0.8},hit:{w:0.95,front:3.6,back:1.6},
   gears:[70,120,165,210,255,300,345],
   snd:{o1:'sawtooth',o2:'square',mul:2,g2:0.2,base:70,range:300,lp:800,lpR:2600,vol:0.12},
   dash:{style:'digital',bg:'#000000',frame:'#444444',num:'#ffffff',unit:'#aaaaaa',bars:['#33ff66','#ffdd00','#ff2222'],gearBg:'#111111',gearFg:'#ff3b3b'},
   ability:{label:'NİTRO',mode:'tap',cd:7,dur:2.5,start(){SFX.boost();},update(dt){S.v+=70*dt;S.co.fov+=12;S.tint='boost';}},
   dashInfo:()=>S.ab.on?'NİTRO!':S.ab.cd>0?'NİTRO '+Math.ceil(S.ab.cd)+'s':'NİTRO HAZIR',
   build:f1Cockpit},

  {id:'taxi',name:'Taksi',emoji:'🚕',desc:'Konuşkan müşteri',
   phys:{A:40,K:120,p:1.8,min:0.6,brake:85,drag:1,steer:0.85},
   cam:{y:1.15,fov:66,lean:0,bob:0,vib:0.5},hit:{w:0.93,front:2.0,back:2.5},
   gears:[50,90,130,170,215],
   snd:{o1:'sawtooth',o2:'square',mul:0.5,g2:0.35,base:30,range:110,lp:350,lpR:800,vol:0.14},
   dash:{style:'taxi'},
   ability:{label:'KORNA',mode:'tap',cd:0.6,start(){SFX.horn();}},
   reset(){S.vs.talk=5;},
   update(dt){S.vs.talk-=dt;if(S.vs.talk<=0&&S.state==='run'){S.vs.talk=rnd(7,11);pop('💬 '+taxiLine(),3.2);}},
   build:taxiCockpit},

  {id:'bus',name:'Otobüs',emoji:'🚌',desc:'Duraktan yolcu al',
   phys:{A:18,K:70,p:1.8,min:0.3,brake:60,drag:1.1,steer:0.55},
   cam:{y:2.3,fov:66,lean:0,bob:0,vib:0.5},hit:{w:1.3,front:1.6,back:10.5},
   gears:[20,35,50,65,80,100],
   snd:{o1:'square',o2:'sawtooth',mul:0.5,g2:0.5,base:24,range:60,lp:240,lpR:600,vol:0.2},
   dash:{style:'digital',bg:'#06140a',frame:'#22aa55',num:'#3cff7a',unit:'#22aa77',bars:['#3cff7a','#ffd84a','#ff4a4a'],gearBg:'#0b2414',gearFg:'#3cff7a'},
   ability:{label:'KAPI',mode:'tap',cd:1,start(){busDoor();}},
   reset(){busReset();},update(dt,d){busUpdate(dt,d);},
   dashInfo:()=>'👥 '+S.vs.pax+' · Durak '+Math.max(0,Math.round(-busStop.z))+'m',
   build:busCockpit},

  {id:'police',name:'Polis',emoji:'🚓',desc:'SİREN: yol açılsın',
   phys:{A:48,K:130,p:1.8,min:0.7,brake:95,drag:1,steer:0.9},
   cam:{y:1.15,fov:66,lean:0,bob:0,vib:0.5},hit:{w:0.93,front:2.0,back:2.5},
   gears:[50,95,140,185,230],
   snd:{o1:'sawtooth',o2:'square',mul:0.5,g2:0.35,base:32,range:120,lp:380,lpR:900,vol:0.13},
   dash:{style:'digital',bg:'#020814',frame:'#1e40af',num:'#e0ecff',unit:'#7aa0ff',bars:['#3b82f6','#ffffff','#ef4444'],gearBg:'#0b1636',gearFg:'#60a5fa'},
   ability:{label:'SİREN',mode:'toggle',start(){sirenOn();pop('🚨 Siren açık, araçlar yol veriyor',2);},end(){sirenOff();},update(dt){policeClear(dt);}},

/* =====================================================================
   GÖKYÜZÜ OLAYLARI — YENİ OLAY EKLEMEK İÇİN BU LİSTEYE BİR NESNE EKLE
   ---------------------------------------------------------------------
   Oyun sürerken yaklaşık her 10 saniyede bir yeni olay başlar. Liste her turda karıştırılır,
   sırayla oynatılır, bitince yeniden karıştırılır (aynı olay arka arkaya gelmez).
   id   : benzersiz kısa ad,   name : açıklama (ekranda gösterilmez),   dur : süre (sn)
   build(): nesneleri kurar, { root, ... } döndürür (root sahneye eklenir, bitince silinir)
   tick(o,k,t,dt): her karede çağrılır. o: build'in döndürdüğü, k: 0→1 ilerleme, t: geçen sn
   Koordinatlar oyuncuya göre: +x sağ, +y yukarı, -z ileri (ufuk). Örnek görünür alan:
   z=-150'de x yaklaşık -200…200, y 0…100.   E.* yardımcıları aşağıda (glow, tail, hero, bird...)
   ===================================================================== */
const BW=135; // evlenme pankartının uzunluğu (m)
const SKY_EVENTS=[
  {id:'meteor',name:'☄️ Meteor yağmuru!',dur:5.5,
   build(){
     const root=new THREE.Group(),m=[];
     for(let i=0;i<6;i++){
       const g=new THREE.Group();g.add(E.glow(0xfff0c0,11));g.add(E.tail(0xff9a40,90,2.4,0.75));
       g.rotation.z=-0.42;g.userData={x:rnd(-320,-40),y:rnd(110,170),z:-rnd(240,340),d:i*0.7+rnd(0,0.3)};
       g.visible=false;root.add(g);m.push(g);
     }
     return {root,m};
   },
   tick(o,k,t){for(const g of o.m){const u=g.userData,tt=t-u.d;g.visible=tt>0&&tt<2.8;if(g.visible)g.position.set(u.x+tt*190,u.y-tt*85,u.z);}}},

  {id:'ufo',name:'🛸 Uzaylılar inek kaçırıyor!',dur:13,
   build(){
     const root=new THREE.Group(),ufo=new THREE.Group();root.add(ufo);
     E.add(ufo,SPH,E.phong(0x9aa3b5),[0,0,0],[14,2.6,14]);
     E.add(ufo,HSPH,E.basic(0x7ff7ff,{transparent:true,opacity:0.75}),[0,1.5,0],[5.5,4.5,5.5]);
     const lights=new THREE.Group();ufo.add(lights);
     const cols=[0xff4040,0xffff40,0x40ff60,0x40c0ff,0xff40ff,0xffa040];
     for(let i=0;i<12;i++){const s=E.glow(cols[i%6],3.5),a=i/12*PI*2;s.position.set(Math.cos(a)*13.5,0,Math.sin(a)*13.5);lights.add(s);}
     const beam=new THREE.Mesh(new THREE.ConeGeometry(10,62,20,1,true),E.basic(0x9dff9d,{additive:true,opacity:0,side:THREE.DoubleSide}));
     beam.position.y=-31;ufo.add(beam);
     const cow=E.cow();cow.scale.setScalar(2.4);root.add(cow);
     return {root,ufo,lights,beam,cow};
   },
   tick(o,k,t){
     const HX=-60,Y=55,Z=-170;let x,y=Y;
     if(k<0.25)x=HX+(260-HX)*(1-k/0.25);
     else if(k<0.8)x=HX+Math.sin(t*1.3)*3;
     else{const q=(k-0.8)/0.2;x=HX-q*q*500;y=Y+q*q*160;}
     o.ufo.position.set(x,y+Math.sin(t*2.5)*1.5,Z);o.ufo.rotation.z=Math.sin(t*1.7)*0.08;
     o.lights.rotation.y=t*3;
     const bk=k>0.3&&k<0.75?Math.min(1,(k-0.3)*12,(0.75-k)*12):0;
     o.beam.material.opacity=bk*0.4;o.beam.visible=bk>0;
     const lift=Math.max(0,Math.min(1,(k-0.36)/0.36));
     o.cow.visible=k<0.73;
     o.cow.position.set(HX,1.9+lift*(Y-6),Z);o.cow.rotation.set(lift*3,lift*5,lift*2);
   }},

  {id:'mothership',name:'🚀 Dev uzay gemisi tepemizde!',dur:16,

  {id:'banner',name:'💍 Biri evlenme teklif ediyor!',dur:19,
   build(){
     const root=new THREE.Group();
     const pl=E.propPlane(0xf2f2f2,0xd02020);pl.rotation.y=PI;pl.scale.setScalar(1.3);root.add(pl);

// ---------- Yardımcılar ----------
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),_p=new THREE.Vector3(),_s=new THREE.Vector3();
function M(x,y,z,rx,ry,rz,sx,sy,sz){
  _e.set(rx||0,ry||0,rz||0);_q.setFromEuler(_e);_p.set(x||0,y||0,z||0);_s.set(sx||1,sy||1,sz||1);
  return new THREE.Matrix4().compose(_p,_q,_s);
}
// Parçaları tek geometriye birleştir (tek draw call, vertex renkli)
function merge(parts){
  const pos=[],nor=[],col=[],c=new THREE.Color();
  for(const pt of parts){
    const g=pt.g.index?pt.g.toNonIndexed():pt.g.clone();
    if(pt.m)g.applyMatrix4(pt.m);
    const P=g.attributes.position.array,N=g.attributes.normal.array;
    c.set(pt.c);
    for(let i=0;i<P.length;i++){pos.push(P[i]);nor.push(N[i]);}
    for(let i=0;i<P.length/3;i++)col.push(c.r,c.g,c.b);
    g.dispose();
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  out.computeBoundingSphere();
  return out;
}
function canvasTex(w,h,draw,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=ANISO;
  return t;
}
function speckle(g,w,h,base,amt,n){
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){
    const v=(Math.random()-.5)*amt;
    g.fillStyle=v>0?'rgba(255,255,255,'+v+')':'rgba(0,0,0,'+(-v)+')';
    g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*3);
  }
}
const BOX=new THREE.BoxGeometry(1,1,1);
const CYL=new THREE.CylinderGeometry(1,1,1,12);
const CYL6=new THREE.CylinderGeometry(1,1,1,6);
const SPH=new THREE.SphereGeometry(1,14,10);
const HSPH=new THREE.SphereGeometry(1,16,8,0,PI*2,0,PI/2);
const CONE=new THREE.ConeGeometry(1,1,14);
const SHARED=new Set([BOX,CYL,CYL6,SPH,HSPH,CONE]);

// ---------- Gösterge (dashboard) dokusu ----------
const dc=document.createElement('canvas');dc.width=256;dc.height=160;
const dg=dc.getContext('2d');
const dashTex=new THREE.CanvasTexture(dc);

/* ---------- Kokpit kurma araçları (K) ----------
   K.p(geo, renk, [x,y,z], [sx,sy,sz], [rx,ry,rz])  → parça
   K.mesh(parçalar, {mat:'phong'|'lambert'|'basic', shiny, transparent, opacity, additive}) → tek mesh
   K.screen(gen, yük, [x,y,z], [rx,ry,rz], kasaRengi, holo) → gösterge ekranı
   K.tor(R, kalınlık) halka,  K.heart(boy) kalp,  K.glass(...) ön cam */
const K={
  BOX,CYL,SPH,HSPH,CONE,
  p:(g,c,pos,scl,rot)=>({g,c,m:M(pos[0],pos[1],pos[2],rot?rot[0]:0,rot?rot[1]:0,rot?rot[2]:0,scl?scl[0]:1,scl?scl[1]:1,scl?scl[2]:1)}),
  mesh(parts,o){
    o=o||{};
    const opt={vertexColors:true,side:o.side||THREE.FrontSide};
    if(o.transparent){opt.transparent=true;opt.opacity=o.opacity==null?0.5:o.opacity;opt.depthWrite=false;}
    if(o.additive)opt.blending=THREE.AdditiveBlending;
    let mat;
    if(o.mat==='basic')mat=new THREE.MeshBasicMaterial(opt);
    else if(o.mat==='lambert')mat=new THREE.MeshLambertMaterial(opt);
    else{opt.shininess=o.shiny==null?50:o.shiny;opt.specular=new THREE.Color(o.spec==null?0x333340:o.spec);mat=new THREE.MeshPhongMaterial(opt);}
    return new THREE.Mesh(merge(parts),mat);
  },
  screen(w,h,pos,rot,house,holo){
    const g=new THREE.Group();g.position.set(pos[0],pos[1],pos[2]);g.rotation.set(rot[0],rot[1]||0,rot[2]||0);
    if(house!=null){const b=new THREE.Mesh(BOX,new THREE.MeshPhongMaterial({color:house,shininess:80}));b.scale.set(w*1.15,h*1.17,0.035);b.position.z=-0.02;g.add(b);}
    const m=holo?new THREE.MeshBasicMaterial({map:dashTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,side:THREE.DoubleSide})
               :new THREE.MeshBasicMaterial({map:dashTex,fog:false});
    g.add(new THREE.Mesh(new THREE.PlaneGeometry(w,h),m));
    return g;
  },
  tor:(R,t)=>new THREE.TorusGeometry(R,t,8,28),
  // iki nokta arasında çubuk: K.rod(renk, [x,y,z], [x,y,z], yarıçap)
  rod(c,a,b,r){
    const A=new THREE.Vector3(a[0],a[1],a[2]),B=new THREE.Vector3(b[0],b[1],b[2]),d=B.clone().sub(A),len=d.length();
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
    return {g:CYL,c,m:new THREE.Matrix4().compose(A.add(B).multiplyScalar(0.5),q,new THREE.Vector3(r,len,r))};
  },
  heart(s){
    const h=new THREE.Shape();
    h.moveTo(0,-s);h.bezierCurveTo(s*0.2,-s*0.6,s,-s*0.3,s,s*0.25);h.bezierCurveTo(s,s*0.8,s*0.3,s*0.95,0,s*0.5);
    h.bezierCurveTo(-s*0.3,s*0.95,-s,s*0.8,-s,s*0.25);h.bezierCurveTo(-s,-s*0.3,-s*0.2,-s*0.6,0,-s);
    return new THREE.ShapeGeometry(h);
  },
  glass(color,opacity,pos,rotX,wb,wt,h){
    const s=new THREE.Shape();s.moveTo(-wb,0);s.lineTo(wb,0);s.lineTo(wt,h);s.quadraticCurveTo(0,h*1.12,-wt,h);s.lineTo(-wb,0);
    const m=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false,side:THREE.DoubleSide,fog:false}));
    m.position.set(pos[0],pos[1],pos[2]);m.rotation.x=rotX;return m;
  }
};

  const t=new THREE.Group();t.position.set(pos[0],pos[1],pos[2]);t.rotation.x=tilt;root.add(t);
  const w=new THREE.Group();t.add(w);
  w.add(K.mesh([

    K.p(BOX,0x1e1e22,[0,-R*0.45,0],[R*0.2,R*0.85,0.02]),

  ],{shiny:40}));
  return w;
}

function frond(len,wid,droop){
  const g=new THREE.PlaneGeometry(len,wid,6,1);
  g.translate(len/2,0,0);g.rotateX(-PI/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const t=p.getX(i)/len;
    p.setZ(i,p.getZ(i)*(1-t*0.85)*(0.4+0.6*Math.sin(Math.min(1,t*3)*PI/2)));
    p.setY(i,-droop*t*t*len+Math.abs(p.getZ(i))*0.3);
  }
  g.computeVertexNormals();
  return g;
}
function palmGeo(h,lean){
  const parts=[];
  const tr=new THREE.CylinderGeometry(0.15,0.27,h,6,6,true);tr.translate(0,h/2,0);
  const tp=tr.attributes.position;
  for(let i=0;i<tp.count;i++){const t=tp.getY(i)/h;tp.setX(i,tp.getX(i)+lean*t*t);}
  tr.computeVertexNormals();
  parts.push({g:tr,c:0x5e4c42});
  const n=9;
  for(let k=0;k<n;k++){
    const len=rnd(3.2,4.4),f=frond(len,rnd(0.8,1.1),rnd(0.18,0.3));
    parts.push({g:f,m:M(lean,h,0,0,k*PI*2/n+rnd(-.2,.2),rnd(0.05,0.45)),c:k%2?0x34503a:0x2c4632});
  }
  for(let k=0;k<3;k++)parts.push({g:frond(3,0.7,0.6),m:M(lean,h-0.1,0,0,rnd(0,6.28),-0.5),c:0x6a5a3c});
  return merge(parts);
}

function hillGeo(seed){
  const g=new THREE.SphereGeometry(1,11,5,0,PI*2,0,PI/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    if(y>0.02){const r=hash(x+seed,z);p.setX(i,x*(0.8+r*0.35));p.setZ(i,z*(0.8+hash(z,x+seed)*0.35));p.setY(i,y*(0.7+r*0.6));}
  }
  g.computeVertexNormals();return g;
}

// ---------- Gökyüzü olayı zamanlayıcısı ----------
const SKY_GAP=10;           // yeni olaylar arası süre (sn)
let skyActive=[],skyQueue=[],skyLast='';
// Karışık sıra: liste bitince yeniden karıştır, yeni turun ilki bir öncekinin sonuncusu olmasın
function nextSkyEvent(){
  if(!skyQueue.length){
    skyQueue=SKY_EVENTS.slice();
    for(let i=skyQueue.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[skyQueue[i],skyQueue[j]]=[skyQueue[j],skyQueue[i]];}
    if(skyQueue.length>1&&skyQueue[0].id===skyLast)skyQueue.push(skyQueue.shift());
  }
  return skyQueue.shift();
}
function startSky(id){
  const ev=(id&&SKY_EVENTS.find(e=>e.id===id))||nextSkyEvent();
  // aynı olay zaten havadaysa onu kapat
  skyActive.filter(a=>a.ev===ev).forEach(endSkyOne);
  const o=ev.build();
  skyRoot.add(o.root);
  skyActive.push({ev,o,t:0});skyLast=ev.id;
  ev.tick(o,0,0,0);
}
function endSkyOne(a){
  if(a.ev.end)a.ev.end(a.o);
  skyRoot.remove(a.o.root);
  a.o.root.traverse(n=>{
    if(n.geometry&&!SHARED.has(n.geometry))n.geometry.dispose();
    if(n.material)for(const m of [].concat(n.material)){if(m.map&&m.map!==glowTex)m.map.dispose();m.dispose();}
  });
  skyActive=skyActive.filter(x=>x!==a);
}
function endSky(){skyActive.slice().forEach(endSkyOne);}
function updateSky(dt){
  skyRoot.position.x=S.x;
  S.skyNext-=dt;
  if(S.skyNext<=0){startSky();S.skyNext=SKY_GAP;}
  for(const a of skyActive.slice()){
    a.t+=dt;
    const k=a.t/a.ev.dur;
    if(k>=1)endSkyOne(a);else a.ev.tick(a.o,k,a.t,dt);
  }
  // olaylardan biri gökyüzünü karartmak istiyorsa (o.dark), yavaşça uygula
  let dk=0;for(const a of skyActive)if(a.o.dark)dk=Math.max(dk,a.o.dark);
  if(Math.abs(dk-envDark)>0.001){envDark+=(dk-envDark)*Math.min(1,dt*1.5);applyEnv(envDark);}
}
const skyRoot=new THREE.Group();scene.add(skyRoot);
window.gokyuzu=id=>startSky(id); // deneme için: konsolda gokyuzu('ufo')

function makePool(n,blend){
  const a=[];
  for(let i=0;i<n;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,blending:blend,fog:false}));
    s.visible=false;s.userData={age:0,life:1,size:1,g:0,v:[0,0,0]};scene.add(s);a.push(s);
  }
  return a;
}
const FXA=makePool(70,THREE.AdditiveBlending),FXS=makePool(40,THREE.NormalBlending);
function emit(pool,x,y,z,color,n,speed,size,life,grav){
  for(let k=0;k<n;k++){
    const s=pool.find(p=>!p.visible);if(!s)return;
    const u=s.userData;s.visible=true;s.material.color.setHex(color);
    u.age=0;u.life=life*rnd(0.7,1.2);u.size=size;u.g=grav;u.v=[rnd(-1,1)*speed,rnd(-0.3,1)*speed,rnd(-1,1)*speed];
    s.position.set(x,y,z);s.scale.set(size,size,1);
  }
}
const fx=(x,y,z,c,n,sp,size,life,g)=>emit(FXA,x,y,z,c,n,sp,size,life,g);
const smoke=(x,y,z)=>emit(FXS,x,y,z,0x3a3a3a,1,0.6,0.5,1.6,-1.5);
function updateFx(dt,d){
  for(const pool of [FXA,FXS])for(const s of pool){
    if(!s.visible)continue;
    const u=s.userData;u.age+=dt;if(u.age>=u.life){s.visible=false;continue;}
    s.position.x+=u.v[0]*dt;s.position.y+=u.v[1]*dt;s.position.z+=u.v[2]*dt+d;u.v[1]-=u.g*dt;
    const k=u.age/u.life,sm=pool===FXS;
    s.material.opacity=(1-k)*(sm?0.6:1);const sc=u.size*(sm?1+k*2.5:1);s.scale.set(sc,sc,1);
  }
}
function clearFx(){for(const s of FXA.concat(FXS))s.visible=false;}

let sfxOut=null,noiseBuf=null,siren=null;
function tone(type,f0,f1,dur,vol,delay){
  if(!AC||!sfxOut)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(sfxOut);o.start(t);o.stop(t+dur+0.05);
}
function noiseHit(dur,vol,f0,f1,delay){
  if(!AC||!sfxOut)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;s.loop=true;f.type='lowpass';
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(sfxOut);s.start(t);s.stop(t+dur+0.05);
}

function abilityUpdate(dt){
  const A=V.ability;if(!A)return;
  const ab=S.ab,run=S.state==='run';
  ab.cd=Math.max(0,ab.cd-dt);
  const pressed=run&&keys.ab&&!ab.prev;ab.prev=keys.ab;
  if(A.mode==='hold'){
    const want=run&&keys.ab&&ab.energy>0.02;
    if(want)ab.energy=Math.max(0,ab.energy-dt*A.drain);else ab.energy=Math.min(1,ab.energy+dt*A.regen);
    if(want!==ab.on){ab.on=want;if(want){if(A.start)A.start();}else if(A.end)A.end();}
    if(ab.on&&A.update)A.update(dt);
  }else if(A.mode==='toggle'){
    if(pressed){ab.on=!ab.on;if(ab.on){if(A.start)A.start();}else if(A.end)A.end();}
    if(ab.on&&A.update)A.update(dt);
  }else{
    if(pressed&&ab.cd<=0&&!ab.on){ab.cd=A.cd;if(A.dur){ab.on=true;ab.t=0;}if(A.start)A.start();}
    if(ab.on){ab.t+=dt;if(A.update)A.update(dt,Math.min(1,ab.t/A.dur));if(ab.t>=A.dur){ab.on=false;if(A.end)A.end();}}
  }
  const p=A.mode==='hold'?ab.energy:A.mode==='toggle'?1:(A.cd?1-ab.cd/A.cd:1);
  const bg='linear-gradient(to top,rgba(150,80,240,.75) '+Math.round(p*100)+'%,rgba(40,25,70,.45) '+Math.round(p*100)+'%)';
  if(bg!==abilBg){abilBg=bg;abilBtn.style.background=bg;}
  abilBtn.classList.toggle('on',ab.on);
}

function spawnCar(c,initial){
  // yavaş araçlarda trafik arkadan da gelip yan şeritten geçsin (yol boş kalmasın)
  const behind=!initial&&S.v<65&&Math.random()<0.5;
  for(let tries=0;tries<20;tries++){
    const lane=(Math.random()*4)|0;
    // başlangıçta yakına da koy (yan şeritlerde bekleyen/geçen araçlar), sonra hep uzağa
    const z=behind?rnd(28,45):initial?(Math.random()<0.45?rnd(-45,22):-rnd(50,420)):-rnd(330,520);
    const x=LANES[lane]+rnd(-0.3,0.3);
    let ok=true;const blocked=new Set();
    for(const o of cars){
      if(o===c||!o.on)continue;
      if(Math.abs(o.z-z)<o.hl+(initial?14:18)){blocked.add(o.lane);if(o.lane===lane){ok=false;break;}}
    }
    if(!ok||blocked.size>=3)continue;
    c.lane=lane;dressCar(c);
    if(initial&&hitsPlayer(c,x,z,22))continue;
    if(behind&&Math.abs(x-S.x)<c.hw+V.hit.w+1.0)continue;
    c.z=z;c.on=true;c.x=x;
    const base=c.type===2?rnd(70,90):rnd(85,125);
    c.sp=(base+(3-lane)*8)/3.6;
    c.grp.visible=true;c.grp.position.set(c.x,0,c.z);
    return;
  }
  c.on=false;c.grp.visible=false;
}

}

  if(RIG){
    camera.remove(RIG.root);
    RIG.root.traverse(o=>{if(o.isMesh){if(!SHARED.has(o.geometry))o.geometry.dispose();o.material.dispose();}});
  }
  RIG=V.build();
  camera.add(RIG.root);
  S.best=parseFloat(store.get('sahilyolu_best_'+V.id))||0;
  store.set('sahilyolu_vehicle',V.id);
  if(eng)setOscTypes();
  document.querySelectorAll('.veh').forEach(b=>b.classList.toggle('sel',b.dataset.id===V.id));
  resetWorld();
}

function resetWorld(){
  S.v=0;S.x=1.875;S.lat=0;S.lean=0;S.dist=0;S.maxV=0;S.crashT=0;S.shake=0;
  endSky();S.skyNext=6;envDark=0;applyEnv(0);
  stopAbility();S.vs={};S.passThru=false;S.tint='';clearFx();popT=0;popEl.style.opacity=0;
  if(V.reset)V.reset();
  for(const c of cars){c.on=false;c.grp.visible=false;}
  for(let i=0;i<11;i++)spawnCar(cars[i],true);
  for(const c of oppCars)spawnOpp(c,true);
  moveWorld(0);
  placeCamera(0);
  updHud();dirty=true;
}

function moveWorld(d){
  S.dist+=d;
  for(const t of scrollTex)t.tex.offset[t.axis]=(S.dist/t.len)%1;
  postsG.position.z=S.dist%4;
  delinG.position.z=S.dist%8;
  lampsG.position.z=S.dist%45;
  for(const list of recyclers)for(const o of list){
    o.z+=d;if(o.z>25){o.z-=o.span;o.place(o,false);}
    o.mesh.position.z=o.z;
  }
}

function crash(){
  if(S.state!=='run')return;
  S.state='crash';S.crashT=0;S.shake=1;
  flash.style.opacity=0.7;
  if(navigator.vibrate)try{navigator.vibrate(250);}catch(e){}
}

function placeCamera(dt){
  const c=V.cam;
  let roll=S.lean+S.co.roll,camY=c.y+Math.sin(S.t*2.2)*(c.bob||0)+S.co.y+S.jumpH;
  if(S.state==='crash'||S.state==='over'){
    const k=Math.min(1,S.crashT/0.7);
    const tip=c.lean>0?1.1:0.25;
    roll+=k*tip;camY-=k*Math.min(0.75,c.y*0.4);
  }
  const vib=Math.min(1,S.v/300)*0.004*(c.vib==null?1:c.vib)+S.shake*0.03;
  camera.position.set(S.x+(Math.random()-.5)*vib,camY+(Math.random()-.5)*vib,0);
  camera.rotation.set(-0.05+(Math.random()-.5)*vib*0.5,-S.lat*0.006,roll);
  const fov=c.fov+Math.min(S.v,420)*0.035+S.co.fov;
  if(Math.abs(camera.fov-fov)>0.05){camera.fov=fov;camera.updateProjectionMatrix();}
  if(RIG&&RIG.steer)RIG.steer.rotation[RIG.steerAxis]=-S.lat*RIG.steerK;
  sky.position.set(camera.position.x,0,0);
}

function update(dt){
  const run=S.state==='run',ph=V.phys;
  S.t+=dt;
  S.co.y=0;S.co.roll=0;S.co.fov=0;S.passThru=false;S.tint='';
  const steer=run?(keys.right?1:0)-(keys.left?1:0):0;
  let a;
  if(run){
    if(keys.gas)a=ph.A/(1+Math.pow(S.v/ph.K,ph.p))+ph.min; // üst sınır yok, hızlandıkça çok yavaş artar
    else a=-(1.5+S.v*0.02)*ph.drag;
    if(keys.brake)a=(keys.gas?a*0.3:a)-ph.brake;
  }else a=-(40+S.v*1.5);
  S.v=Math.max(0,S.v+a*dt);
  if(S.v>S.maxV)S.maxV=S.v;

  const sf=Math.min(1,S.v/25);
  const tgt=steer*(2.2+Math.min(S.v,380)*0.022)*sf*ph.steer;
  S.lat+=(tgt-S.lat)*Math.min(1,dt*(ph.grip||6));
  S.x+=S.lat*dt;
  const lo=xMin(),hi=xMax();
  if(S.x<lo||S.x>hi){
    S.x=Math.max(lo,Math.min(hi,S.x));S.lat=0;
    if(S.v>20){S.v*=1-dt*0.9;S.shake=Math.max(S.shake,0.35);}
  }
  S.lean+=(Math.max(-0.42,Math.min(0.42,-S.lat*V.cam.lean))-S.lean)*Math.min(1,dt*5);

  abilityUpdate(dt);
  const ms=S.v/3.6,d=ms*dt;
  moveWorld(d);
  if(V.update)V.update(dt,d);

  const target=Math.min(16,11+Math.floor(S.dist/1500));
  for(let i=0;i<cars.length;i++){
    const c=cars[i];
    if(!c.on){if(i<target&&Math.random()<dt)spawnCar(c,false);continue;}
    c.z+=(ms-c.sp)*dt;
    if(c.tx!=null)c.x+=(c.tx-c.x)*Math.min(1,dt*1.8);
    if(c.fly){ // tank çarptı: havaya savrulur
      const f=c.fly;f.t+=dt;c.x+=f.v[0]*dt;c.y+=f.v[1]*dt;c.z+=f.v[2]*dt;f.v[1]-=20*dt;
      c.grp.rotation.x+=f.r[0]*dt;c.grp.rotation.y+=f.r[1]*dt;c.grp.rotation.z+=f.r[2]*dt;
      if(f.t>3||c.y<-4){spawnCar(c,false);continue;}
    }
    if(c.burn!=null){ // ejderha yaktı: kararır, alev alır, gömülür
      c.burn+=dt;c.y=-c.burn*0.35;
      if(Math.random()<dt*12)fx(c.x+rnd(-0.8,0.8),c.ht+c.y,c.z+rnd(-1.5,1.5),Math.random()<0.5?0xff7a1a:0xffd040,1,2,2.2,0.6,-3);
      if(c.burn>1.6){smoke(c.x,1,c.z);spawnCar(c,false);continue;}
    }
    if(c.mini){const s=c.grp.scale.x;if(s>0.3)c.grp.scale.setScalar(Math.max(0.3,s-dt*2));}
    if(c.z>60||c.z<-580){if(i<target)spawnCar(c,false);else{c.on=false;c.grp.visible=false;}continue;}
    c.grp.position.set(c.x,c.y,c.z);
    if(run&&!c.fly&&c.burn==null&&!c.mini&&hitsPlayer(c,c.x,c.z,0)){
      if(S.passThru||S.jumpH>c.ht-0.3){}           // hayalet geçişi / zıplama: çarpmaz
      else if(V.onHit&&V.onHit(c)){}               // araca özel (tank ezer)
      else crash();
    }
  }
  for(const c of oppCars){
    c.z+=(ms+c.sp)*dt;
    if(c.z>30)spawnOpp(c,false);
    c.grp.position.set(c.x,0,c.z);
  }

  updateSky(dt);
  updateFx(dt,d);
  if(RIG.tick)RIG.tick(dt);
  if(popT>0){popT-=dt;if(popT<=0)popEl.style.opacity=0;}
  if(S.state==='crash'){S.crashT+=dt;if(S.crashT>1.3)gameOver();}
  S.shake=Math.max(0,S.shake-dt*1.5);
  placeCamera(dt);
  if(vig.className!==S.tint)vig.className=S.tint;
  vig.style.opacity=S.tint?'1':Math.min(0.95,S.v/320).toFixed(2);
  const fo=parseFloat(flash.style.opacity)||0;
  if(fo>0)flash.style.opacity=Math.max(0,fo-dt*2);
}

// ---------- Ses ----------
let AC=null,eng=null,muted=false;
function setOscTypes(){
  const s=V.snd;
  eng.o1.type=s.o1;eng.o2.type=s.o2;eng.g2.gain.value=s.g2;
}
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.Q.value=3;
    const eg=AC.createGain();eg.gain.value=0;lp.connect(eg);eg.connect(master);
    const o1=AC.createOscillator();const g1=AC.createGain();g1.gain.value=0.5;o1.connect(g1);g1.connect(lp);
    const o2=AC.createOscillator();const g2=AC.createGain();g2.gain.value=0.25;o2.connect(g2);g2.connect(lp);
    o1.start();o2.start();
    eng={master,lp,eg,o1,o2,g2};
    sfxOut=AC.createGain();sfxOut.gain.value=0;sfxOut.connect(AC.destination);
    setOscTypes();
  }catch(e){AC=null;eng=null;}
}
function updAudio(){
  if(!eng)return;
  const t=AC.currentTime,on=!muted&&(S.state==='run'||S.state==='crash'),s=V.snd;
  const rpm=gearInfo(S.v).rpm,f=s.base+rpm*s.range;
  eng.master.gain.setTargetAtTime(on?1:0,t,0.08);
  sfxOut.gain.setTargetAtTime(on?1:0,t,0.03);
  eng.eg.gain.setTargetAtTime(s.vol*(keys.gas?1.15:0.85),t,0.08);
  if(f>0){eng.o1.frequency.setTargetAtTime(f,t,0.03);eng.o2.frequency.setTargetAtTime(f*s.mul,t,0.03);}
  eng.lp.frequency.setTargetAtTime(s.lp+rpm*s.lpR+(keys.gas?500:0),t,0.05);
}

// ---------- Durumlar / arayüz ----------
const ov=$('ov'),ovTitle=$('ovTitle'),ovTxt=$('ovTxt'),ovMain=$('ovMain'),ovReset=$('ovReset'),ovGarage=$('ovGarage'),grid=$('grid'),bPause=$('bPause');
let dirty=true;
// Araç seçim kartları listeden otomatik oluşur
VEHICLES.forEach(v=>{
  const b=document.createElement('button');b.className='veh';b.dataset.id=v.id;
  b.innerHTML='<span class="e">'+v.emoji+'</span><span class="n">'+v.name+'</span><span class="d">'+v.desc+'</span>';
  b.addEventListener('click',()=>applyVehicle(v.id));
  grid.appendChild(b);
});
function showOv(mode,title,txt){
  ovTitle.textContent=title;ovTxt.innerHTML=txt;
  grid.style.display=mode==='menu'?'':'none';
  ovMain.textContent=mode==='menu'?'BAŞLA':mode==='pause'?'▶ DEVAM':'⟲ TEKRAR';
  ovReset.style.display=mode==='pause'?'':'none';
  ovGarage.style.display=mode==='menu'?'none':'';
  ov.classList.add('show');
}
function showMenu(){
  S.state='menu';bPause.textContent='▶';
  showOv('menu','SAHİL YOLU','Aracını seç ve trafiğe çarpmadan ne kadar uzağa gidebileceğini gör.');
  resetWorld();updAudio();
}
function startRun(){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  for(const k in keys)keys[k]=false;
  document.querySelectorAll('.pad.on').forEach(e=>e.classList.remove('on'));
  S.state='run';ov.classList.remove('show');bPause.textContent='⏸';
  last=performance.now();
}
function pause(){
  if(S.state!=='run')return;
  S.state='pause';bPause.textContent='▶';
  showOv('pause','DURAKLATILDI',V.emoji+' '+V.name+' &nbsp;·&nbsp; Mesafe: <b>'+(S.dist/1000).toFixed(2)+' km</b>');
  updAudio();dirty=true;
}
function resetGame(){resetWorld();startRun();}
function gameOver(){
  S.state='over';bPause.textContent='▶';
  const km=S.dist/1000;let rec='';
  if(km>S.best){S.best=km;rec='<br><b style="color:#ffd27a">🏆 YENİ REKOR!</b>';store.set('sahilyolu_best_'+V.id,String(km));}
  showOv('over','KAZA!',V.emoji+' '+V.name+' &nbsp;·&nbsp; Mesafe: <b>'+km.toFixed(2)+' km</b> &nbsp;·&nbsp; En yüksek hız: <b>'+Math.round(S.maxV)+' km/h</b>'+rec);
  updAudio();updHud();dirty=true;
}
ovMain.addEventListener('click',()=>{
  if(S.state==='menu'||S.state==='pause')startRun();
  else if(S.state==='over')resetGame();
});
ovReset.addEventListener('click',resetGame);
ovGarage.addEventListener('click',showMenu);
bPause.addEventListener('click',()=>{
  if(S.state==='run')pause();
  else if(S.state==='pause'||S.state==='menu')startRun();
  else if(S.state==='over')resetGame();
});
$('bReset').addEventListener('click',resetGame);
const bSound=$('bSound');
bSound.addEventListener('click',()=>{muted=!muted;bSound.textContent=muted?'🔇':'🔊';initAudio();updAudio();});

const toast=$('toast');let toastT=0;
function showToast(t){toast.textContent=t;toast.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>toast.style.display='none',3500);}
function lockLandscape(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}
function toggleFS(){
  const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){
    (d.exitFullscreen||d.webkitExitFullscreen).call(d);return;
  }
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){showToast('iPhone\'da tam ekran için: Safari → Paylaş → "Ana Ekrana Ekle", sonra oradan aç.');return;}
  try{const p=req.call(el,{navigationUI:'hide'});if(p&&p.then)p.then(lockLandscape).catch(()=>showToast('Tam ekran açılamadı'));else lockLandscape();}catch(e){showToast('Tam ekran açılamadı');}
}
$('bFs').addEventListener('click',toggleFS);
$('ovFs').addEventListener('click',toggleFS);
$('rotFs').addEventListener('click',toggleFS);

function bindPad(id,k){
  const el=$(id);
  const on=e=>{e.preventDefault();keys[k]=true;el.classList.add('on');};
  const off=e=>{e.preventDefault();keys[k]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
}
bindPad('gas','gas');bindPad('brake','brake');bindPad('pLeft','left');bindPad('pRight','right');bindPad('abil','ab');
document.addEventListener('touchmove',e=>{if(!e.target.closest('.card'))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

const KM={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyE:'ab',ShiftLeft:'ab',ShiftRight:'ab'};
window.addEventListener('keydown',e=>{
  if(KM[e.code]){keys[KM[e.code]]=true;e.preventDefault();}
  else if(e.code==='KeyP'||e.code==='Escape'){if(S.state==='run')pause();else if(S.state==='pause')startRun();}
  else if(e.code==='KeyR')resetGame();
  else if(e.code==='Enter'&&S.state!=='run'&&S.state!=='crash')ovMain.click();
});
window.addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pause();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pause();if(AC)AC.suspend();}
  else if(AC&&!muted)AC.resume();
});

const rot=$('rot');
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  const portrait=isTouch&&h>w;
  rot.classList.toggle('show',portrait);
  if(portrait)pause();
  dirty=true;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,250));

// ---------- Döngü ----------
let last=performance.now(),hudT=0,ft=0,fn=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;
  if(dt<=0)return;
  if(dt>0.05)dt=0.05;
  if(S.state==='run'||S.state==='crash'){
    if(dt>0.025){update(dt/2);if(S.state==='run'||S.state==='crash')update(dt/2);}else update(dt);
    hudT+=dt;if(hudT>0.1){hudT=0;updHud();}
    updAudio();
    renderer.render(scene,camera);
    // FPS düşerse çözünürlüğü otomatik azalt (donmasın diye)
    ft+=dt;fn++;
    if(ft>2){if(ft/fn>1/40&&pr>0.75){pr=Math.max(0.75,pr-0.25);renderer.setPixelRatio(pr);resize();}ft=0;fn=0;}
  }else if(dirty){
    dirty=false;
    renderer.render(scene,camera);
  }
}
resize();
applyVehicle(store.get('sahilyolu_vehicle')||VEHICLES[0].id);
requestAnimationFrame(loop);
})();
</script>
